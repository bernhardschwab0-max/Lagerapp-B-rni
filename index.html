      root.innerHTML = '<div style="padding:24px;font-family:monospace;white-space:pre-wrap;color:#B3401D;background:#FBEAE2;max-width:700px;margin:40px auto;border-radius:8px;line-height:1.5;">' +

        '\n\nBitte mach einen Screenshot von diesem Text.</div>';
    }
  });
  // Selbstheilung: Laden die Programmbibliotheken nicht (z.B. kaputter Offline-Speicher),
  // wird der Offline-Speicher geleert und die Seite einmal neu geladen. Deine Daten bleiben erhalten.
  window.addEventListener('load', function () {
    var flag = 'selbstheilung';
    var ss = null;
    try { ss = window.sessionStorage; } catch (e) {}
    if (window.React && window.ReactDOM && window.Babel) { if (ss) ss.removeItem(flag); return; }
    if (!ss || ss.getItem(flag)) {
      var root = document.getElementById('root');
      if (root) root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#B3401D;background:#FBEAE2;max-width:500px;margin:60px auto;border-radius:12px;line-height:1.5;text-align:center;">' +
        '<b>Die App konnte nicht geladen werden.</b><br>Bitte Internetverbindung prüfen und die App neu öffnen.</div>';
      return;
    }
    ss.setItem(flag, '1');
    var aufgaben = [];
    if (navigator.serviceWorker) aufgaben.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) aufgaben.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(aufgaben).catch(function () {}).then(function () { location.reload(); });
  });
</script>

const ALLERGENS = [
  { key: "gluten", label: "Gluten" },
  { key: "krebstiere", label: "Krebstiere" },

// ---------- Rechnungs-Scan: Hilfsfunktionen ----------
function normalizeName(s) {
  return (s || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}
function levenshtein(a, b) {
  const m = a.length,
    n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}
function nameSimilarity(a, b) {
  const na = normalizeName(a),
    nb = normalizeName(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  if (na.includes(nb) || nb.includes(na)) return 0.85;
  const dist = levenshtein(na, nb);
  return 1 - dist / Math.max(na.length, nb.length);
}
function findBestMatch(name, list, getName = (x) => x.name) {
  let best = null,
    bestScore = 0;
  for (const item of list) {
    const score = nameSimilarity(name, getName(item));
    if (score > bestScore) {
      bestScore = score;
      best = item;
    }
  }
  return { material: bestScore >= 0.55 ? best : null, match: bestScore >= 0.55 ? best : null, score: bestScore };
}
function parsePriceToken(token) {
  const cleaned = token.replace(/[€\s]/g, "");
  if (/,\d{2}$/.test(cleaned)) {
    return parseFloat(cleaned.replace(/\./g, "").replace(",", "."));
  }
  return parseFloat(cleaned.replace(",", "."));
}
function normalizeUnitToken(u) {
  const t = u.toLowerCase();
  if (t === "stück") return "stk";
  return t;
}
function convertQty(value, fromUnit, toUnit) {
  if (value == null || !fromUnit || !toUnit) return null;
  const f = normalizeUnitToken(fromUnit);
  const t = normalizeUnitToken(toUnit);
  if (f === t) return value;
  if (f === "kg" && t === "g") return value * 1000;
  if (f === "g" && t === "kg") return value / 1000;
  if (f === "l" && t === "ml") return value * 1000;
  if (f === "ml" && t === "l") return value / 1000;
  return null;
}
function extractQuantity(line, beforeIndex) {
  const re = /(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|stk|stück)\b/gi;
  let m;
  let best = null;
  while ((m = re.exec(line))) {
    if (beforeIndex != null && m.index >= beforeIndex - 1) continue;
    best = { value: parseFloat(m[1].replace(",", ".")), unit: normalizeUnitToken(m[2]) };
  }
  return best;
}
function parseInvoiceText(text, materials) {
  const priceRe = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*€?/g;
  const lines = text
    .split("\n")
    .map((l) => l.trim())
    .filter((l) => l.length > 2);
  const items = [];
  for (const line of lines) {
    const matches = [...line.matchAll(priceRe)];
    if (matches.length === 0) continue;
    const last = matches[matches.length - 1];
    const price = parsePriceToken(last[0]);
    if (!isFinite(price) || price <= 0 || price > 100000) continue;
    let name = line.slice(0, last.index).trim();
    const qty = extractQuantity(line, last.index);
    name = name
      .replace(/^\d+[.,]?\d*\s*(kg|g|l|ml|stk|stück|x)?\s*/i, "")
      .replace(/[-–:]+$/, "")
      .trim();
    if (!name || name.length < 2) continue;
    const { material, score } = findBestMatch(name, materials);
    items.push({
      id: uid(),
      rawLine: line,
      erkannterName: name,
      preis: price,
      mengeGekauft: qty ? qty.value : null,
      mengeEinheit: qty ? qty.unit : null,
      materialId: material ? material.id : "",
      matchScore: score,
      uebernehmenPreis: true,
      uebernehmenMenge: !!qty,
    });
  }
  return items;
}

// ---------- Preise/Allergene-Import: Hilfsfunktionen ----------
function parseEuro(str) {
  if (!str) return null;
  const cleaned = String(str)
    .replace(/[€\s]/g, "")
    .replace(",", ".");
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : null;
}

const ALLERGEN_KEYWORDS = {
  gluten: ["weizen", "roggen", "gerste", "hafer", "dinkel", "grünkern", "kamut", "einkorn", "emmer", "graham", "malz"],
  milch: ["milch", "butter", "sahne", "rahm", "käse", "joghurt", "topfen", "mascarpone", "molke", "schlagobers"],
  eier: ["eiweiss", "eiweiß", "eigelb", "\\bdotter\\b", "vollei", "\\bei\\b", "\\beier\\b"],
  soja: ["soja"],
  schalenfruechte: ["mandel", "haselnuss", "walnuss", "pistazie", "macadamia", "cashew", "pekannuss", "paranuss"],
  erdnuesse: ["erdnuss", "erdnüsse"],
  sesam: ["sesam"],
  senf: ["\\bsenf\\b"],
  sellerie: ["sellerie"],
  sulfite: ["schwefeldioxid", "sulfit"],
  lupinen: ["lupine", "süsslupinenmehl", "süßlupinenmehl"],
  krebstiere: ["krebstier", "garnele"],
  fisch: ["\\bfisch\\b"],
  weichtiere: ["weichtier", "muschel", "tintenfisch"],
};
function extractAllergens(text) {
  if (!text) return [];
  const lower = text.toLowerCase();
  const found = [];
  Object.entries(ALLERGEN_KEYWORDS).forEach(([key, words]) => {
    if (words.some((w) => new RegExp(w, "i").test(lower))) found.push(key);
  });
  return found;
}

const ADDITIVE_KEYWORDS = [
  "Emulgator",
  "Konservierungsstoff",
  "Säuerungsmittel",
  "Säureregulator",
  "Verdickungsmittel",
  "Stabilisator",
  "Farbstoff",
  "Geliermittel",
  "Trennmittel",
  "Backtriebmittel",
  "Antioxidationsmittel",
  "Süßungsmittel",
];
function extractZusatzstoffe(text) {
  if (!text) return "";
  const found = [];
  ADDITIVE_KEYWORDS.forEach((kw) => {
    const re = new RegExp(kw + "[^,;]*", "gi");
    let m;
    while ((m = re.exec(text))) {
      found.push(m[0].trim());
    }
  });
  return [...new Set(found)].join("; ");
}

function parsePriceList(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim() !== "");
  if (lines.length < 2) return { rows: [], error: "Keine Datenzeilen gefunden. Bitte die komplette Tabelle inkl. Kopfzeile einfügen." };
  const delimiter = lines[0].includes("\t") ? "\t" : ",";
  const headers = lines[0].split(delimiter).map((h) => h.trim().toLowerCase());
  const idxNameMain = headers.findIndex((h) => h.includes("produktbezeichnung im rezept"));
  const idxNameFallback = headers.findIndex((h) => h.trim() === "produkt");
  const idxPriceKg = headers.findIndex((h) => h.includes("nettopreis / kg") || h.includes("nettopreis/kg"));
  const idxLabel = headers.findIndex((h) => h.includes("lebensmittelkennzeichnung"));
  const idxAllergenCol = headers.findIndex((h) => h.trim() === "allergene");

  const nameIdx = idxNameMain !== -1 ? idxNameMain : idxNameFallback;
  if (nameIdx === -1 || idxPriceKg === -1) {
    return {
      rows: [],
      error:
        "Konnte die Spalten \"Produktbezeichnung im Rezept\" (oder \"Produkt\") und/oder \"Nettopreis / kg\" nicht finden. Bitte die Original-Kopfzeile mit einfügen.",
    };
  }

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(delimiter);
    const name = (cells[nameIdx] || "").trim();
    if (!name) continue;
    const priceKg = parseEuro(cells[idxPriceKg]);
    const labelText = idxLabel !== -1 ? (cells[idxLabel] || "").trim() : "";
    const allergenColText = idxAllergenCol !== -1 ? (cells[idxAllergenCol] || "").trim() : "";
    const combinedText = [labelText, allergenColText].filter(Boolean).join(", ");
    rows.push({
      rawName: name,
      priceKg,
      allergene: extractAllergens(combinedText || name),
      zusatzstoffe: extractZusatzstoffe(combinedText),
    });
  }
  return { rows, error: null };
}

const fmtEUR = (n) => (isFinite(n) ? n.toLocaleString("de-DE", { style: "currency", currency: "EUR" }) : "–");
// Löst "virtuelle" Rohstoffe (z.B. Sauerteig = Mehl+Wasser) rekursiv in echte, gelagerte Rohstoffe auf.
// Findet/erzeugt zu bestehenden Rohstoffen (per Namensabgleich, unabhängig von IDs) die passende
// Vorteig-Auflösung, damit ältere, schon eingerichtete Lager automatisch nachgerüstet werden.
// Zusammensetzung der Vorstufen. Bei mehreren Namen gilt der erste vorhandene Rohstoff
// (z.B. "Roggen 960" oder – falls gelöscht – "Roggenmehl 960").
const VORSTUFEN_DEFS = [
  { match: ["Sauerteig D."], teile: [[["Dinkelmehl"], 0.5], [["Wasser"], 0.5]] },
  { match: ["Sauerteig R."], teile: [[["Roggen 960", "Roggenmehl 960"], 0.5], [["Wasser"], 0.5]] },
  { match: ["Dinkel K.", "Kochstück D.", "Kochstück D"], teile: [[["Wasser"], 0.8], [["Dinkelmehl"], 0.2]] },
  { match: ["Roggen K.", "Kochstück R.", "Kochstück R"], teile: [[["Wasser"], 0.806452], [["Roggen 960", "Roggenmehl 960"], 0.193548]] },
  { match: ["Kochstück RS.", "Kochstück RS"], teile: [[["Wasser"], 0.75], [["Roggenschrot"], 0.25]] },
  { match: ["Knoblauchbutter"], teile: [[["Butter"], 0.851064], [["Knoblauch"], 0.13617], [["Salz"], 0.002553], [["Oregano"], 0.008511], [["Pfeffer"], 0.001702]] },
];
const findByName = (list, names) =>
  list.find((m) => names.some((n) => m.name.trim().toLowerCase() === n.toLowerCase()));
const findVorstufenDef = (name) =>
  VORSTUFEN_DEFS.find((d) => d.match.some((n) => n.toLowerCase() === (name || "").trim().toLowerCase()));
function baueVorstufenTeile(def, materials, selbstId) {
  return def.teile
    .map(([namen, anteil]) => {
      const target = findByName(materials, namen);
      return target && target.id !== selbstId ? { materialId: target.id, anteil } : null;
    })
    .filter(Boolean);
}

function migrateVorteige(materials) {
  let changed = false;
  let updated = materials.map((m) => {
    if (m.vorteig) return m;
    const def = findVorstufenDef(m.name);
    if (!def || def.match.includes("Knoblauchbutter")) return m;
    const teile = baueVorstufenTeile(def, materials, m.id);
    if (teile.length === 0) return m;
    changed = true;
    return { ...m, vorteig: { teile } };
  });

  // Knoblauchbutter automatisch anlegen, falls noch nicht vorhanden
  if (!findByName(updated, ["Knoblauchbutter"])) {
    const butter = findByName(updated, ["Butter"]);
    const knoblauch = findByName(updated, ["Knoblauch"]);
    const salz = findByName(updated, ["Salz"]);
    const oregano = findByName(updated, ["Oregano"]);
    const pfeffer = findByName(updated, ["Pfeffer"]);
    if (butter && knoblauch && salz && oregano && pfeffer) {
      updated = [
        ...updated,
        {
          id: uid(),
          name: "Knoblauchbutter",
          price: 0,
          unit: "g",
          mindestbestand: 0,
          stock: 0,
          zusatzstoffe: "",
          allergene: [],
          vorteig: {
            teile: [
              { materialId: butter.id, anteil: 0.851064 },

              { materialId: salz.id, anteil: 0.002553 },

              { materialId: pfeffer.id, anteil: 0.001702 },
            ],
          },
        },
      ];
      changed = true;
    }
  }

  return { materials: updated, changed };
}

// Ein schon eingetragener Preis wird NICHT überschrieben (nur gemeldet), außer bei ueberschreiben = true.
// Allergene werden nur ergänzt, nie entfernt.
function lagerlisteUebernehmen(materials, liste = LAGERLISTE_2024, merker = "lagerliste2024", ueberschreiben = false) {
  const norm = (s) => (s || "").trim().toLowerCase();
  const info = { preise: [], allergene: [], behalten: [] };
  const mats = materials.map((m) => {
    if (m[merker] || m.vorteig) return m;
    const e = liste.find(([name]) => norm(name) === norm(m.name));
    if (!e) return m;
    const [, preisKg, allergene, listenName] = e;
    const neu = { ...m, [merker]: true };
    // Preis in der Einheit des Rohstoffs (die App rechnet pro g bzw. ml)
    const proEinheit = ["g", "ml"].includes(m.unit) ? preisKg / 1000 : ["kg", "l"].includes(m.unit) ? preisKg : null;
    if (proEinheit != null && preisKg > 0) {
      if (!(Number(m.price) > 0) || (ueberschreiben && Math.abs(Number(m.price) - proEinheit) > 1e-6)) {
        neu.price = Math.round(proEinheit * 1e6) / 1e6;
        info.preise.push(`${m.name} ${fmtEUR(preisKg)}/kg${listenName && listenName !== m.name ? ` (${listenName})` : ""}`);
      } else if (Math.abs(Number(m.price) - proEinheit) > 1e-6) {
        info.behalten.push(m.name);
      }
    }
    const fehlend = allergene.filter((a) => !(m.allergene || []).includes(a));
    if (fehlend.length) {
      neu.allergene = [...(m.allergene || []), ...fehlend];
      info.allergene.push(`${m.name} (${fehlend.map(allergenLabel).join(", ")})`);
    }
    return neu;
  });
  return { materials: mats, info, changed: mats.some((m, i) => m !== materials[i]) };
}

// Repariert Verweise auf gelöschte Rohstoffe (z.B. nach dem Löschen eines doppelten "Roggen 960"):
// - Vorstufen (Sauerteig, Kochstück …) werden aus VORSTUFEN_DEFS neu zusammengesetzt
// - Excel-Rezepte bekommen die passende Zutat wieder (Position im Rezept + ZUTAT_ALIAS)
// Liefert, was repariert wurde und was nur von Hand behoben werden kann.
function repariereVerweise(materials, recipes) {
  const norm = (s) => (s || "").trim().toLowerCase();
  const ids = new Set(materials.map((m) => m.id));
  const repariert = [];
  const offen = [];

  const mats = materials.map((m) => {
    const teile = m.vorteig?.teile || [];
    if (!teile.some((t) => !ids.has(t.materialId))) return m;
    const def = findVorstufenDef(m.name);
    const neu = def ? baueVorstufenTeile(def, materials, m.id) : [];
    if (def && neu.length === def.teile.length) {
      repariert.push(m.name);
      return { ...m, vorteig: { teile: neu } };
    }
    offen.push(m.name);
    return m;
  });

  const recs = recipes.map((r) => {
    if (!r.items.some((it) => !ids.has(it.materialId))) return r;
    const ex = EXCEL_REZEPTE.find((e) => [e.name, ...(e.alias || [])].map(norm).includes(norm(r.name)));
    const flach = ex ? ex.gruppen.flatMap((g) => g.z) : [];
    let allesGut = true;
    const items = r.items.map((it, i) => {
      if (ids.has(it.materialId)) return it;
      const zutat = flach[i] && Math.abs(flach[i][1] - it.menge) < 0.01 ? flach[i][0] : null;
      const kandidaten = zutat ? ZUTAT_ALIAS[zutat] || [zutat] : [];
      const target = findByName(mats, kandidaten);
      if (target) return { ...it, materialId: target.id };
      allesGut = false;
      return it;
    });
    (allesGut ? repariert : offen).push(r.name);
    return { ...r, items };
  });

  return { materials: mats, recipes: recs, repariert, offen };
}

function migrateRecipes(recipes, materials) {

  const findMat = (name) => materials.find((m) => m.name.trim().toLowerCase() === name.toLowerCase());

  };

}

function expandVorteige(items, materials, depth = 0) {
  if (depth > 5) return items; // Sicherheitsnetz gegen Zirkelbezüge
  const result = new Map();
  for (const it of items) {
    const mat = materials.find((m) => m.id === it.materialId);
    if (mat && mat.vorteig && mat.vorteig.teile && mat.vorteig.teile.length > 0) {
      const subItems = mat.vorteig.teile.map((t) => ({ materialId: t.materialId, menge: it.menge * t.anteil }));
      const expanded = expandVorteige(subItems, materials, depth + 1);
      expanded.forEach((e) => {
        result.set(e.materialId, (result.get(e.materialId) || 0) + e.menge);
      });
    } else {
      result.set(it.materialId, (result.get(it.materialId) || 0) + it.menge);
    }
  }
  return [...result.entries()].map(([materialId, menge]) => ({ materialId, menge }));
}

const groupByKategorie = (recipes) => {
  const groups = {};
  const order = [];
  recipes.forEach((r) => {
    const k = r.kategorie || "Sonstige";
    if (!groups[k]) {
      groups[k] = [];
      order.push(k);
    }
    groups[k].push(r);
  });
  return order.map((k) => ({ kategorie: k, items: groups[k] }));
};

// Teile alter Rezepte, die jetzt als Abschnitt im richtigen Rezept stecken
const VERALTETE_TEILREZEPTE = ["Streusel", "Schneedecke"];

function applyRezeptImport(recipes, materials, columnMap) {
  // Bis zu welchem Schritt ist schon importiert? (höchste importVersion in den Rezepten)
  const stand = Math.max(-1, ...recipes.map((r) => IMPORT_SCHRITTE.indexOf(r.importVersion)));
  if (stand >= IMPORT_SCHRITTE.length - 1) {
    return { recipes, materials, changed: false };
  }
  const norm = (s) => (s || "").trim().toLowerCase();
  let mats = [...materials];
  const neueRohstoffe = [];

  const resolveMaterial = (excelName) => {
    const candidates = ZUTAT_ALIAS[excelName] || [excelName];
    for (const c of candidates) {
      const hit = mats.find((m) => norm(m.name) === norm(c));
      if (hit) return hit.id;
    }
    const neu = { id: uid(), name: candidates[0], price: 0, unit: "g", mindestbestand: 0, stock: 0, zusatzstoffe: "", allergene: extractAllergens(candidates[0]) };
    mats.push(neu);
    neueRohstoffe.push(neu.name);
    return neu.id;
  };

  let recs = [...recipes];
  const aktualisiert = [];
  const neu = [];
  for (let schritt = stand + 1; schritt < IMPORT_SCHRITTE.length; schritt++) {
  const version = IMPORT_SCHRITTE[schritt];
  EXCEL_REZEPTE.filter((ex) => (ex.seit || IMPORT_SCHRITTE[0]) === version).forEach((ex) => {
    const items = [];
    ex.gruppen.forEach((g) => {
      g.z.forEach(([zutat, menge]) => {
        const item = { materialId: resolveMaterial(zutat), menge };
        if (g.titel) item.gruppe = g.titel;
        items.push(item);
      });
    });
    const names = [ex.name, ...(ex.alias || [])].map(norm);
    const idx = recs.findIndex((r) => names.includes(norm(r.name)));
    const data = {
      name: ex.name,
      kategorie: ex.kategorie,
      ausbringungMenge: 1,
      ausbringungEinheit: "Ansatz",
      stueckProAnsatz: ex.stueck || 1,
      teiggewicht: ex.teiggewicht || "",
      backen: ex.backen || "",
      anleitung: ex.anleitung || "",
      items,
      importVersion: version,
    };
    if (idx >= 0) {
      recs[idx] = { ...recs[idx], ...data };
      if (!aktualisiert.includes(ex.name) && !neu.includes(ex.name)) aktualisiert.push(ex.name);
    } else {
      recs.push({ id: uid(), ...data });
      neu.push(ex.name);
    }
  });
  if (schritt > 0) continue;

  // ---- nur beim ersten Schritt ----
  // Knoblauch-Ciabatta folgt dem aktualisierten Dinkel Ciabatta
  const ciabatta = recs.find((r) => norm(r.name) === "dinkel ciabatta");
  const kb = mats.find((m) => norm(m.name) === "knoblauchbutter");
  const kIdx = recs.findIndex((r) => norm(r.name) === "knoblauch dinkelciabatta");
  if (ciabatta && kb && kIdx >= 0) {
    recs[kIdx] = {
      ...recs[kIdx],
      kategorie: ciabatta.kategorie,
      stueckProAnsatz: 1,
      teiggewicht: ciabatta.teiggewicht,
      anleitung: "Wie Dinkel Ciabatta + 50 g Knoblauchbutter pro Stück.",
      items: [...ciabatta.items, { materialId: kb.id, menge: 50, gruppe: "Topping" }],
    };
  }

  // Alte Bruchstücke entfernen, sofern sie im Bestellung-Tab nicht zugeordnet sind
  const usedIds = new Set(Object.values(columnMap || {}).map((m) => m && m.recipeId).filter(Boolean));
  recs = recs.filter((r) => !(VERALTETE_TEILREZEPTE.some((n) => norm(n) === norm(r.name)) && !r.importVersion && !usedIds.has(r.id)));
  }

  return { recipes: recs, materials: mats, changed: true, info: { aktualisiert, neu, neueRohstoffe } };
}

// Gruppiert die Zutaten eines Rezepts nach ihrem Abschnitt (z.B. "Vorteig", "Hauptteig")
function groupItems(items) {
  const groups = [];
  items.forEach((it) => {
    const titel = it.gruppe || "";
    const last = groups[groups.length - 1];
    if (last && last.titel === titel) last.items.push(it);
    else groups.push({ titel, items: [it] });
  });
  return groups;
}

// ---------- Cloud-Sync über jsonbin.io ----------
function getConfig() {
  try {
    if (window.location.hash && window.location.hash.startsWith("#setup=")) {
      try {
        const encoded = decodeURIComponent(window.location.hash.slice(7));
        const decoded = atob(encoded);
        const sep = decoded.indexOf("|");
        if (sep > -1) {
          const apiKey = decoded.slice(0, sep);
          const binId = decoded.slice(sep + 1);
          const vorher = localStorage.getItem("jsonbin_binid");
          // Schutz: ein fremder Link darf die App nicht unbemerkt auf einen anderen Speicher umstellen
          if (
            apiKey && binId &&
            (!vorher || vorher === binId ||
              window.confirm("Achtung: Dieser Link verbindet die App mit einem ANDEREN Online-Speicher.\n\nNur bestätigen, wenn der Link von deinem eigenen Gerät stammt. Fortfahren?"))
          ) {
            saveConfig(apiKey, binId);
          }
        }
      } catch (e) {}
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    const apiKey = localStorage.getItem("jsonbin_apikey");
    const binId = localStorage.getItem("jsonbin_binid");
    if (apiKey && binId) return { apiKey, binId };
  } catch (e) {}
  return null;
}
function makeSetupUrl(apiKey, binId) {
  const encoded = btoa(`${apiKey}|${binId}`);
  return `${window.location.origin}${window.location.pathname}#setup=${encodeURIComponent(encoded)}`;
}
function saveConfig(apiKey, binId) {
  localStorage.setItem("jsonbin_apikey", apiKey);
  localStorage.setItem("jsonbin_binid", binId);
}
function clearConfig() {
  localStorage.removeItem("jsonbin_apikey");
  localStorage.removeItem("jsonbin_binid");
}
// Sicherungen bleiben lokal auf dem Gerät (nicht in der Cloud), damit das
// jsonbin.io-Gratislimit von 100kb pro Datensatz nicht durch mehrfach
// gespeicherte Vollkopien der Daten überschritten wird.
function loadLocalBackups() {
  try {
    const raw = localStorage.getItem("lager_backups");
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveLocalBackups(backups) {
  try {
    localStorage.setItem("lager_backups", JSON.stringify(backups));
  } catch (e) {}
}
async function createBin(apiKey, data) {
  const res = await fetch("https://api.jsonbin.io/v3/b", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Master-Key": apiKey, "X-Bin-Name": "lagerdaten" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error("Erstellen fehlgeschlagen");
  const json = await res.json();
  return json.metadata.id;
}
async function readBin(apiKey, binId) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
    headers: { "X-Master-Key": apiKey },
  });
  if (!res.ok) throw new Error("Laden fehlgeschlagen");
  const json = await res.json();
  return json.record;
}
async function writeBin(apiKey, binId, data) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": apiKey },
    body: JSON.stringify(data),
  });
  if (!res.ok) {
    let detail = "";
    try {
      const errJson = await res.json();
      detail = errJson?.message || "";
    } catch (e) {}
    throw new Error(`Speichern fehlgeschlagen (Status ${res.status}${detail ? ": " + detail : ""})`);
  }
  return true;
}
async function getVersionCount(apiKey, binId) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/versions/count`, {
    headers: { "X-Master-Key": apiKey },
  });
  if (!res.ok) throw new Error("Versionsanzahl konnte nicht geladen werden");
  const json = await res.json();
  return json.metadata?.versionCount ?? 0;
}
async function readBinVersion(apiKey, binId, version) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/${version}`, {
    headers: { "X-Master-Key": apiKey },
  });
  if (!res.ok) throw new Error("Version konnte nicht geladen werden");
  const json = await res.json();
  return json.record;
}

function VersionRecoveryPanel({ config, onRestore, onClose }) {
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [versionCount, setVersionCount] = useState(0);
  const [versionInput, setVersionInput] = useState("");
  const [preview, setPreview] = useState(null);
  const [previewError, setPreviewError] = useState("");
  const [loadingPreview, setLoadingPreview] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const count = await getVersionCount(config.apiKey, config.binId);
        setVersionCount(count);
        setVersionInput(String(Math.max(1, count - 1)));
        setStatus("ready");
      } catch (e) {
        setStatus("error");
      }
    })();
  }, []);

  const loadPreview = async () => {
    if (!versionInput) return;
    setLoadingPreview(true);
    setPreviewError("");
    setPreview(null);
    try {
      const record = await readBinVersion(config.apiKey, config.binId, versionInput);
      const materials = record.materials || [];
      const recipes = record.recipes || [];
      const totalStock = materials.reduce((s, m) => s + (Number(m.stock) || 0), 0);
      const withStock = materials.filter((m) => Number(m.stock) > 0).length;
      setPreview({ record, materials: materials.length, recipes: recipes.length, totalStock, withStock });
    } catch (e) {
      setPreviewError("Diese Version konnte nicht geladen werden.");
    } finally {
      setLoadingPreview(false);
    }
  };

  const restore = () => {
    if (!preview) return;
    if (
      !window.confirm(
        `Version ${versionInput} wirklich wiederherstellen? Dein aktueller Stand wird durch diese Version ersetzt (${preview.materials} Rohstoffe, ${preview.withStock} davon mit Bestand > 0).`
      )
    )
      return;
    onRestore(preview.record);
  };

  return (
    <div className="mb-6 p-4 rounded-lg" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>
          Alte Version aus Cloud-Verlauf wiederherstellen
        </h3>
        <button onClick={onClose} style={{ color: COL.inkMuted }}>
          <X size={16} />
        </button>
      </div>

      {status === "loading" && <p className="text-sm" style={{ color: COL.inkMuted }}>Lade Versionsliste…</p>}
      {status === "error" && (
        <p className="text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
          Versionshistorie konnte nicht geladen werden.
        </p>
      )}

      {status === "ready" && (
        <div className="flex flex-col gap-3">
          <p className="text-sm" style={{ color: COL.inkMuted }}>
            Es gibt <strong>{versionCount}</strong> gespeicherte Versionen (jede Änderung wird automatisch als eigene Version
            abgelegt). Probier verschiedene Versionsnummern durch, bis die Vorschau wieder echte Bestände zeigt – am
            wahrscheinlichsten ist eine Nummer knapp unter der höchsten.
          </p>
          <div className="flex items-center gap-2">
            <Field label={`Versionsnummer (1–${versionCount})`}>
              <input
                style={{ ...inputStyle, width: 140 }}
                type="number"
                min="1"
                max={versionCount}
                value={versionInput}
                onChange={(e) => setVersionInput(e.target.value)}
              />
            </Field>
            <button
              onClick={loadPreview}
              disabled={loadingPreview}
              className="text-sm font-medium px-3 py-2 rounded-lg mt-5"
              style={{ border: `1px solid ${COL.accent}`, color: COL.accent, opacity: loadingPreview ? 0.6 : 1 }}
            >

            </button>
          </div>

          {previewError && (
            <div className="text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
              {previewError}
            </div>
          )}

          {preview && (
            <div className="flex flex-col gap-2">
              <div
                className="text-sm px-3 py-2 rounded-lg"
                style={{ backgroundColor: preview.totalStock > 0 ? COL.okSoft : COL.warnSoft, color: preview.totalStock > 0 ? COL.ok : COL.warn }}
              >

                (Gesamtsumme: {fmtNum(preview.totalStock)}).

              </div>
              <button onClick={restore} className="text-sm font-medium px-3 py-2 rounded-lg w-fit" style={{ backgroundColor: COL.accent, color: "#fff" }}>

        </div>
      )}
    </div>
  );
}

// QR-Code wird direkt auf dem Gerät erzeugt – der Einrichtungs-Link (mit Schlüssel) verlässt das Gerät nicht
function QrCode({ text, size = 220 }) {
  const src = useMemo(() => {
    try {
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      const zelle = Math.max(2, Math.floor(size / (qr.getModuleCount() + 8)));
      return qr.createDataURL(zelle, zelle * 4);
    } catch (e) {
      return null;
    }
  }, [text, size]);
  if (!src) return <p className="text-xs" style={{ color: COL.warn }}>QR-Code konnte nicht erzeugt werden – bitte den Link unten verwenden.</p>;
  return <img src={src} width={size} height={size} alt="QR-Code zum Einrichten" style={{ imageRendering: "pixelated", borderRadius: 8, border: `1px solid ${COL.line}` }} />;
}

  try {
    if (window.location.hash.startsWith("#backzettel=")) {
      const raw = decodeURIComponent(window.location.hash.slice("#backzettel=".length));
      sessionStorage.setItem("backzettel_eingang", raw);
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    const raw = sessionStorage.getItem("backzettel_eingang");
    if (!raw) return null;
    const p = JSON.parse(raw);
    return p && p.id && Array.isArray(p.items) ? p : null;
  } catch (e) {

  }
}

function BackzettelEingang({ eingang, materials, setMaterials, orderHistory, setOrderHistory, onDone }) {
  const norm = (s) => (s || "").trim().toLowerCase();
  const rows = eingang.items
    .map((it) => {
      const mat = materials.find((m) => m.id === it.materialId) || materials.find((m) => norm(m.name) === norm(it.name));
      return { ...it, mat, needed: Number(it.needed) || 0 };
    })
    .filter((r) => r.needed > 0);
  const unbekannt = rows.filter((r) => !r.mat);
  const ok = rows.filter((r) => r.mat);
  const alt = orderHistory.find((h) => h.id === eingang.id);

  const abbuchen = () => {
    setMaterials((prev) =>
      prev.map((m) => {
        const zurueck = alt ? alt.items.find((i) => i.materialId === m.id)?.needed || 0 : 0;
        const ab = ok.filter((r) => r.mat.id === m.id).reduce((s, r) => s + r.needed, 0);
        return zurueck || ab ? { ...m, stock: Math.round((m.stock + zurueck - ab) * 1000) / 1000 } : m;
      })
    );
    const entry = {
      id: eingang.id,
      appliedAt: new Date().toISOString(),
      label: eingang.label || "Backzettel (Bestell-App)",
      items: ok.map((r) => ({ materialId: r.mat.id, needed: r.needed })),
    };
    setOrderHistory((prev) => [entry, ...prev.filter((h) => h.id !== eingang.id)].slice(0, 50));
    onDone(true);
  };

  return (
    <div className="mb-6 rounded-2xl p-4 sm:p-5" style={{ backgroundColor: COL.surface, border: `2px solid ${COL.accent}`, boxShadow: "0 8px 30px rgba(196,98,45,0.15)", animation: "fadeIn .3s ease" }}>
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <div className="text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700 }}>📥 Backzettel aus der Bestell-App</div>
          <div className="text-sm" style={{ color: COL.inkMuted }}>{eingang.label}</div>
        </div>
        <button onClick={() => onDone(false)} style={{ color: COL.inkMuted }} aria-label="Verwerfen"><X size={18} /></button>
      </div>
      {alt && (
        <div className="text-sm px-3 py-2 rounded-lg mb-3" style={{ backgroundColor: COL.amberSoft, color: COL.amber }}>
          Dieser Backzettel wurde am {new Date(alt.appliedAt).toLocaleString("de-DE")} schon abgebucht. Beim Abbuchen wird der alte Abzug zurückgebucht und durch den neuen ersetzt.
        </div>
      )}
      <div className="rounded-xl overflow-hidden mb-3" style={{ border: `1px solid ${COL.line}` }}>
        <div className="grid gap-3 text-xs font-semibold uppercase px-3 py-2" style={{ gridTemplateColumns: "1fr auto auto", backgroundColor: COL.bg, color: COL.inkMuted }}>
          <span>Rohstoff</span><span className="text-right">abbuchen</span><span className="text-right">danach</span>
        </div>
        {ok.map((r, i) => {
          const zurueck = alt ? alt.items.find((x) => x.materialId === r.mat.id)?.needed || 0 : 0;
          const danach = r.mat.stock + zurueck - r.needed;
          return (
            <div key={i} className="grid gap-3 text-sm px-3 py-1.5" style={{ gridTemplateColumns: "1fr auto auto", borderTop: `1px solid ${COL.line}` }}>

              <span className="text-right" style={{ fontFamily: "'IBM Plex Mono', monospace", color: danach < 0 ? COL.warn : COL.ok }}>{fmtNum(danach, 1)}</span>
            </div>

// ---------- Abgleich zwischen Handy und Laptop ----------
// Jedes Gerät merkt sich den zuletzt geladenen/gespeicherten Stand ("Basis"). Hat inzwischen ein anderes
// Gerät gespeichert, werden beim Speichern beide Änderungen zusammengeführt statt überschrieben.
const GERAET = (() => {
  let id = "";
  try {
    id = localStorage.getItem("geraet_id") || "";
    if (!id) {
      id = Math.random().toString(36).slice(2, 7);
      localStorage.setItem("geraet_id", id);
    }
  } catch (e) {}
  const art = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "Handy" : "PC";
  return { id, art };
})();
const neuerStand = () => ({ zeit: new Date().toISOString(), geraet: GERAET.id, art: GERAET.art });
const ohneStand = (rec) => {
  if (!rec || typeof rec !== "object") return rec;
  const { _stand, ...rest } = rec;
  return rest;
};
const gleichJson = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hatIds = (arr) => Array.isArray(arr) && arr.every((x) => x && typeof x === "object" && x.id != null);

// Drei-Wege-Abgleich: basis = gemeinsamer Ausgangsstand, mein = dieses Gerät, dein = Speicher (anderes Gerät)
function abgleichen(basis, mein, dein, schluessel) {
  if (gleichJson(mein, basis)) return dein;
  if (dein === undefined || gleichJson(dein, basis) || gleichJson(mein, dein)) return mein;
  // Lagerbestand: Änderungen beider Geräte zusammenrechnen (z.B. zwei Abbuchungen)
  if (schluessel === "stock" && [basis, mein, dein].every((v) => typeof v === "number")) {
    return Math.round((dein + (mein - basis)) * 1000) / 1000;
  }
  // Listen mit IDs (Rohstoffe, Rezepte, Kunden, Backtage, Bestellungen …): Eintrag für Eintrag
  if (hatIds(mein) && hatIds(dein)) {
    const b = new Map((hatIds(basis) ? basis : []).map((x) => [x.id, x]));
    const m = new Map(mein.map((x) => [x.id, x]));
    const d = new Map(dein.map((x) => [x.id, x]));
    const ergebnis = [];
    dein.forEach((t) => {
      const bb = b.get(t.id);
      const mm = m.get(t.id);
      if (!mm) {
        if (bb && gleichJson(t, bb)) return; // hier gelöscht, dort unverändert -> weg
        ergebnis.push(t); // dort neu oder dort geändert -> behalten
        return;
      }
      ergebnis.push(bb ? abgleichen(bb, mm, t) : mm);
    });
    mein.forEach((mm) => {
      if (d.has(mm.id)) return;
      const bb = b.get(mm.id);
      if (bb && gleichJson(mm, bb)) return; // dort gelöscht, hier unverändert -> weg
      ergebnis.push(mm); // hier neu oder hier geändert -> behalten
    });
    return ergebnis;
  }
  // Objekte: Feld für Feld
  const istObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  if (istObj(mein) && istObj(dein)) {
    const bo = istObj(basis) ? basis : {};
    const out = {};
    new Set([...Object.keys(dein), ...Object.keys(mein)]).forEach((k) => {
      if (!(k in mein) && k in bo) {
        if (!gleichJson(dein[k], bo[k])) out[k] = dein[k]; // hier gelöscht, dort geändert -> behalten
        return;
      }
      if (!(k in dein) && k in bo) {
        if (!gleichJson(mein[k], bo[k])) out[k] = mein[k];
        return;
      }
      const v = abgleichen(bo[k], mein[k], dein[k], k);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  return mein; // beide Geräte haben denselben Wert geändert -> dieses Gerät gewinnt
}

// Form der Lager-Daten im Speicher (ohne _stand) – Grundlage für den Vergleich
const lagerNormalisieren = (rec) => ({
  materials: rec?.materials || [],
  recipes: rec?.recipes || [],
  columnMap: rec?.columnMap || {},
  orderHistory: rec?.orderHistory || [],
});

const fmtStand = (st) => {
  if (!st || !st.zeit) return "";
  const d = new Date(st.zeit);
  const heute = new Date().toDateString() === d.toDateString();
  const zeit = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const wer = st.geraet === GERAET.id ? "diesem Gerät" : st.art === "Handy" ? "dem Handy" : st.art === "PC" ? "dem Laptop/PC" : "einem anderen Gerät";
  return `${heute ? "heute" : d.toLocaleDateString("de-DE")} ${zeit} von ${wer}`;
};

  const [tab, setTab] = useState("rohstoffe");
  const [materials, setMaterials] = useState(seedMaterials);
  const [recipes, setRecipes] = useState(seedRecipes);
  const [columnMap, setColumnMap] = useState({});
  const [orderHistory, setOrderHistory] = useState([]);
  const [backups, setBackups] = useState([]);
  const [showBackups, setShowBackups] = useState(false);
  const [showQR, setShowQR] = useState(false);
  const [showSettingsMenu, setShowSettingsMenu] = useState(false);
  const [showVersionRecovery, setShowVersionRecovery] = useState(false);
  const [loading, setLoading] = useState(true);
  const [syncState, setSyncState] = useState("idle"); // idle | saving | saved | error
  const [syncErrorDetail, setSyncErrorDetail] = useState("");
  const [importInfo, setImportInfo] = useState(null);
  const [verweisInfo, setVerweisInfo] = useState(null);
  const [lagerlisteInfo, setLagerlisteInfo] = useState(null);
  const [eingang, setEingang] = useState(() => leseBackzettelAusLink());
  const [eingangOk, setEingangOk] = useState(false);
  const [gruss] = useState(begruessung);
  const [spruch] = useState(() => BAECKER_SPRUECHE[Math.floor(Math.random() * BAECKER_SPRUECHE.length)]);
  const loadedRef = React.useRef(false);
  // Abgleich: zuletzt geladener/gespeicherter Stand im Speicher und wann
  const basisRef = React.useRef(null);
  const basisZeitRef = React.useRef(0);
  const skipSaveRef = React.useRef(false);
  const dirtyRef = React.useRef(false);
  const saveChainRef = React.useRef(Promise.resolve());
  const [letzterStand, setLetzterStand] = useState(null);
  const [abgleichInfo, setAbgleichInfo] = useState(null);
  const [ladeFehler, setLadeFehler] = useState("");
  const [ladeVersuch, setLadeVersuch] = useState(0);

  useEffect(() => {
    if (!config) {
      setLoading(false);
      return;
    }
    let cancelled = false;
    setLoading(true);
    setLadeFehler("");
    (async () => {
      try {
        const data = await readBin(config.apiKey, config.binId);
        if (!cancelled) {
          basisRef.current = lagerNormalisieren(data);
          basisZeitRef.current = Date.now();
          setLetzterStand(data._stand || null);
          let mats = data.materials || [];
          let recs = data.recipes || [];
          let existingBackups = loadLocalBackups();
          if (mats.length > 0) {
            const migMat = migrateVorteige(mats);
            mats = migMat.materials;
            const migRec = migrateRecipes(recs, mats);
            recs = migRec.recipes;
            const imp = applyRezeptImport(recs, mats, data.columnMap);
            if (imp.changed) {
              // Vor dem Rezept-Update den bisherigen Stand sichern
              const vorher = { timestamp: new Date().toISOString(), materials: data.materials, recipes: data.recipes, columnMap: data.columnMap || {}, label: "vor Rezept-Update" };
              existingBackups = [vorher, ...existingBackups].slice(0, 5);
              saveLocalBackups(existingBackups);
              mats = imp.materials;
              recs = imp.recipes;
              setImportInfo(imp.info);
            }
            const rep = repariereVerweise(mats, recs);
            mats = rep.materials;
            recs = rep.recipes;
            if (rep.repariert.length || rep.offen.length) setVerweisInfo(rep);
            const ll = lagerlisteUebernehmen(mats);
            const pr = lagerlisteUebernehmen(ll.materials, PREISE_2026_10, "preise202610");
            const kor = lagerlisteUebernehmen(pr.materials, KORREKTUR_2026_10, "korrektur202610", true);
            mats = kor.materials;
            const preisInfo = {
              preise: [...ll.info.preise, ...pr.info.preise, ...kor.info.preise],
              allergene: [...ll.info.allergene, ...pr.info.allergene, ...kor.info.allergene],
              behalten: [...ll.info.behalten, ...pr.info.behalten].filter((n) => !kor.info.preise.some((p) => p.startsWith(n + " "))),
            };
            if (preisInfo.preise.length || preisInfo.allergene.length || preisInfo.behalten.length) setLagerlisteInfo(preisInfo);
          }
          if (data.materials) setMaterials(mats);
          if (data.recipes) setRecipes(recs);
          if (data.columnMap) setColumnMap(data.columnMap);
          if (data.orderHistory) setOrderHistory(data.orderHistory);
          // Nur speichern, wenn beim Laden wirklich etwas angepasst wurde (Import, Reparatur) – spart Zugriffe
          const geladen = lagerNormalisieren({ ...data, materials: data.materials ? mats : undefined, recipes: data.recipes ? recs : undefined });
          skipSaveRef.current = gleichJson(geladen, basisRef.current);
          setBackups(existingBackups);

          // Einmal täglich beim ersten Öffnen automatisch eine Sicherung anlegen (nur lokal, nicht in der Cloud)
          if (mats.length > 0) {
            const today = new Date().toISOString().slice(0, 10);
            const hasTodayBackup = existingBackups.some((b) => b.timestamp && b.timestamp.slice(0, 10) === today);
            if (!hasTodayBackup) {
              const snapshot = { timestamp: new Date().toISOString(), materials: mats, recipes: recs, columnMap: data.columnMap || {} };
              const newBackups = [snapshot, ...existingBackups].slice(0, 5);
              setBackups(newBackups);
              saveLocalBackups(newBackups);
            }
          }
        }
        if (!cancelled) {
          loadedRef.current = true;
          setLoading(false);
        }
      } catch (e) {
        // Nicht mit Musterdaten weiterarbeiten – sonst würden die echten Daten beim nächsten Speichern überschrieben
        if (!cancelled) {
          loadedRef.current = false;
          setLadeFehler(e?.message || "Speicher nicht erreichbar");
          setLoading(false);
        }
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [config, ladeVersuch]);

  const latestRef = React.useRef({});
  useEffect(() => {
    latestRef.current = { materials, recipes, columnMap, orderHistory, backups, config };
  });

  const uebernehmen = (d) => {
    skipSaveRef.current = true;
    setMaterials(d.materials);
    setRecipes(d.recipes);
    setColumnMap(d.columnMap);
    setOrderHistory(d.orderHistory);
  };
  const aktuellerStand = () => {
    const l = latestRef.current;
    return { materials: l.materials, recipes: l.recipes, columnMap: l.columnMap || {}, orderHistory: l.orderHistory || [] };
  };

  // Speichern mit Abgleich: Ist der eigene Stand älter als 2 Minuten, zuerst nachsehen, ob ein anderes Gerät
  // inzwischen gespeichert hat – dann beide Änderungen zusammenführen statt zu überschreiben.
  const speichern = async (mein) => {
    const config = latestRef.current.config;
    let ziel = mein;
    if (Date.now() - basisZeitRef.current > 2 * 60 * 1000) {
      const cloud = await readBin(config.apiKey, config.binId);
      const dein = lagerNormalisieren(cloud);
      if (!gleichJson(dein, basisRef.current)) {
        ziel = abgleichen(basisRef.current, mein, dein);
        setAbgleichInfo(cloud._stand || { zeit: new Date().toISOString() });
      }
    }
    const stand = neuerStand();
    await writeBin(config.apiKey, config.binId, { ...ziel, _stand: stand });
    basisRef.current = ziel;
    basisZeitRef.current = Date.now();
    setLetzterStand(stand);
    if (!gleichJson(ziel, mein)) {
      // Änderungen vom anderen Gerät übernehmen – inkl. allem, was hier während des Speicherns geändert wurde
      const jetzt = aktuellerStand();
      uebernehmen(gleichJson(jetzt, mein) ? ziel : abgleichen(mein, jetzt, ziel));
    }
    dirtyRef.current = !gleichJson(aktuellerStand(), ziel);
  };

  useEffect(() => {
    if (!config || !loadedRef.current) return;
    if (skipSaveRef.current) {
      skipSaveRef.current = false;
      return;
    }
    dirtyRef.current = true;
    setSyncState("saving");
    const t = setTimeout(() => {
      const mein = { materials, recipes, columnMap, orderHistory };
      saveChainRef.current = saveChainRef.current
        .then(() => speichern(mein))
        .then(() => {
          setSyncState("saved");
          setSyncErrorDetail("");
        })
        .catch((e) => {
          setSyncState("error");
          setSyncErrorDetail(e?.message || "Unbekannter Fehler");
        });
    }, 800);
    return () => clearTimeout(t);
  }, [materials, recipes, columnMap, orderHistory]);

  // Neuesten Stand holen (beim Zurückkehren in die App oder per Knopf) – nur wenn hier nichts ungespeichert ist
  const vomSpeicherHolen = async (zwingend = false) => {
    const config = latestRef.current.config;
    if (!config || !loadedRef.current || dirtyRef.current) return;
    try {
      const cloud = await readBin(config.apiKey, config.binId);
      const dein = lagerNormalisieren(cloud);
      setLetzterStand(cloud._stand || null);
      if (!gleichJson(dein, basisRef.current) || zwingend) {
        if (!gleichJson(dein, aktuellerStand())) uebernehmen(dein);
        basisRef.current = dein;
      }
      basisZeitRef.current = Date.now();
      setSyncState("saved");
    } catch (e) {}
  };

  useEffect(() => {
    let verstecktSeit = 0;
    const lokaleSicherung = () => {
      if (!loadedRef.current) return;
      const { materials, recipes, columnMap, backups } = latestRef.current;
      const snapshot = { timestamp: new Date().toISOString(), materials, recipes, columnMap };
      saveLocalBackups([snapshot, ...(backups || [])].slice(0, 5));
    };
    // Nur wenn noch eine Änderung auf dem Weg ist: sofort abschicken (kein blindes Überschreiben mehr)
    const ausstehendSpeichern = () => {
      const { config } = latestRef.current;
      if (!config || !loadedRef.current || !dirtyRef.current) return;
      try {
        const stand = neuerStand();
        fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": config.apiKey },
          body: JSON.stringify({ ...aktuellerStand(), _stand: stand }),
          keepalive: true,
        });
      } catch (e) {}
    };
    const onVisibilityChange = () => {
      if (document.visibilityState === "hidden") {
        verstecktSeit = Date.now();
        lokaleSicherung();
        ausstehendSpeichern();
      } else if (verstecktSeit && Date.now() - verstecktSeit > 20 * 1000) {
        vomSpeicherHolen();
      }
    };
    document.addEventListener("visibilitychange", onVisibilityChange);
    window.addEventListener("pagehide", ausstehendSpeichern);
    return () => {
      document.removeEventListener("visibilitychange", onVisibilityChange);
      window.removeEventListener("pagehide", ausstehendSpeichern);
    };
  }, []);

  const createManualBackup = () => {
    const snapshot = { timestamp: new Date().toISOString(), materials, recipes, columnMap };
    const newBackups = [snapshot, ...backups].slice(0, 5);
    setBackups(newBackups);
    saveLocalBackups(newBackups);
  };

  const restoreBackup = (b) => {
    if (!window.confirm(`Stand vom ${new Date(b.timestamp).toLocaleString("de-DE")} wiederherstellen? Der aktuelle Stand wird überschrieben.`))
      return;
    setMaterials(b.materials);
    setRecipes(b.recipes);
    if (b.columnMap) setColumnMap(b.columnMap);
    setShowBackups(false);
  };

  const resetToDefaults = async () => {
    if (!window.confirm("Wirklich alle Eingaben löschen und auf die ursprünglich importierten Daten zurücksetzen?")) return;
    const imp = applyRezeptImport(seedRecipes, migrateVorteige(seedMaterials).materials, {});
    // wird wie jede andere Änderung automatisch gespeichert
    setMaterials(imp.materials);
    setRecipes(imp.recipes);
  };

  const resetStockToZero = () => {
    if (!window.confirm("Alle Lagerbestände (Bestand) auf 0 setzen? Preise, Mindestbestände, Rezepte und Zusatzstoffe bleiben erhalten.")) return;
    setMaterials((prev) => prev.map((m) => ({ ...m, stock: 0 })));
  };

  const disconnect = () => {
    if (!window.confirm("Verbindung zum Online-Speicher auf diesem Gerät trennen?")) return;
    clearConfig();
    window.location.reload();
  };

  if (!config) {
    return (
      <SetupScreen
        onReady={() => {
          setConfig(getConfig());
        }}
      />
    );
  }

  if (loading) {
    return (
      <div
        className="min-h-screen w-full flex flex-col items-center justify-center gap-4"
        style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.inkMuted }}
      >
        <div style={{ fontSize: 56, animation: "rise 1.6s ease-in-out infinite" }}>🍞</div>
        <Brand small />
        <div className="text-sm">Der Ofen heizt vor … deine Daten kommen gleich.</div>
      </div>
    );
  }

  if (ladeFehler) {
    return (
      <div
        className="min-h-screen w-full flex flex-col items-center justify-center gap-4 px-6 text-center"
        style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.ink }}
      >
        <Brand small />
        <div className="text-4xl">📡</div>
        <div className="font-semibold">Deine Daten konnten nicht geladen werden.</div>
        <div className="text-sm max-w-sm" style={{ color: COL.inkMuted }}>
          Bitte Internetverbindung prüfen. Damit nichts überschrieben wird, arbeitet die App erst weiter, wenn deine Daten da sind.
          <br />
          <span className="text-xs">({ladeFehler})</span>
        </div>
        <button onClick={() => setLadeVersuch((v) => v + 1)} className="text-sm font-semibold px-4 py-2.5 rounded-xl" style={{ backgroundColor: COL.accent, color: "#fff" }}>
          Nochmal versuchen
        </button>
      </div>
    );
  }

  const lowStock = materials.filter((m) => m.mindestbestand > 0 && m.stock <= m.mindestbestand);

  return (
    <div
      className="min-h-screen w-full"
      style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.ink }}
    >
      <div className="max-w-5xl mx-auto px-4 pt-4 pb-28 sm:py-8">
        <header className="mb-6">
          <div
            className="relative rounded-3xl px-5 py-5 sm:px-7 sm:py-6 z-10"
            style={{
              background: `radial-gradient(circle at 85% 20%, rgba(232,182,76,0.28), transparent 45%), linear-gradient(135deg, ${COL.crust} 0%, #5A3A24 100%)`,
              boxShadow: "0 10px 30px rgba(59,42,30,0.25)",
            }}
          >
            <div className="absolute inset-0 overflow-hidden rounded-3xl pointer-events-none" aria-hidden="true">
              <div className="absolute -right-6 -bottom-10 opacity-10">
                <WheatLogo size={180} color={COL.wheat} />
              </div>
            </div>
          <div className="relative flex items-start justify-between gap-3">
            <Brand light />

            <div className="relative">
              <div className="flex items-center gap-2">
                <span
                  className="hidden sm:flex items-center gap-1 text-xs px-2.5 py-1 rounded-full"
                  style={{ color: syncState === "error" ? "#FFD2C2" : "rgba(255,255,255,0.75)", backgroundColor: "rgba(255,255,255,0.08)" }}
                >
                  {syncState === "saving" && "speichert …"}
                  {syncState === "saved" && (
                    <>
                      <CheckCircle2 size={12} /> synchronisiert
                    </>
                  )}
                  {syncState === "error" && <span title={syncErrorDetail}>Speichern fehlgeschlagen ⓘ</span>}
                  {syncState === "idle" && "bereit"}
                </span>
                <button
                  onClick={() => setShowSettingsMenu((v) => !v)}
                  className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-xl transition-colors"
                  style={{ border: "1px solid rgba(255,255,255,0.2)", backgroundColor: showSettingsMenu ? "rgba(255,255,255,0.2)" : "rgba(255,255,255,0.1)", color: "#fff" }}
                  aria-label="Einstellungen"
                >
                  <Settings size={16} />
                  <span className="hidden sm:inline">Einstellungen</span>
                </button>
              </div>

              {showSettingsMenu && (
                <>
                  <div className="fixed inset-0 z-[5]" onClick={() => setShowSettingsMenu(false)} />
                  <div
                    className="absolute right-0 top-full mt-2 w-72 rounded-xl overflow-hidden z-10"
                    style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}`, boxShadow: "0 8px 24px rgba(38,32,25,0.12)" }}
                  >
                  <div className="px-4 py-3 text-xs" style={{ backgroundColor: COL.bg, color: COL.inkMuted, borderBottom: `1px solid ${COL.line}` }}>
                    <div>
                      Speicher-Nr. <b style={{ color: COL.ink, fontFamily: "'IBM Plex Mono', monospace" }}>…{String(config.binId).slice(-6)}</b> · dieses Gerät: {GERAET.art}
                    </div>
                    {letzterStand && <div className="mt-0.5">Zuletzt gespeichert: {fmtStand(letzterStand)}</div>}
                    <div className="mt-1" style={{ fontSize: 11 }}>Auf Handy und Laptop muss dieselbe Nummer stehen.</div>
                    <button
                      onClick={() => {
                        vomSpeicherHolen(true);
                        setShowSettingsMenu(false);
                      }}
                      className="mt-2 text-xs font-semibold px-2.5 py-1.5 rounded-lg"
                      style={{ backgroundColor: COL.accent, color: "#fff" }}
                    >
                      🔄 Jetzt abgleichen
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      setShowQR(true);
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors flex items-center gap-2"
                    style={{ color: COL.accent }}
                  >
                    Neues Gerät einrichten
                  </button>
                  <a
                    href={BESTELL_APP_URL}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors flex items-center gap-2"
                    style={{ color: COL.ink }}
                  >
                    🧾 Bestell-App öffnen
                  </a>
                  <button
                    onClick={() => {
                      setShowBackups(true);
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors"
                    style={{ color: COL.ink }}
                  >
                    Sicherungen ({backups.length})
                  </button>
                  <button
                    onClick={() => {
                      setShowVersionRecovery(true);
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors"
                    style={{ color: COL.ink }}
                  >
                    Cloud-Verlauf durchsuchen
                  </button>
                  <div style={{ borderTop: `1px solid ${COL.line}` }} />
                  <button
                    onClick={() => {
                      resetStockToZero();
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors"
                    style={{ color: COL.ink }}
                  >
                    Bestände auf 0 setzen
                  </button>
                  <button
                    onClick={() => {
                      resetToDefaults();
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors"
                    style={{ color: COL.ink }}
                  >
                    Auf Ausgangsstand zurücksetzen
                  </button>
                  <div style={{ borderTop: `1px solid ${COL.line}` }} />
                  <button
                    onClick={() => {
                      disconnect();
                      setShowSettingsMenu(false);
                    }}
                    className="w-full text-left text-sm px-4 py-2.5 hover:bg-black/[0.03] transition-colors"
                    style={{ color: COL.warn }}
                  >
                    Verbindung trennen
                  </button>
                  </div>
                </>
              )}
            </div>
          </div>

            <div className="relative mt-5">
              <div className="text-xl sm:text-2xl text-white" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
                {gruss.text} <span style={{ display: "inline-block", animation: "wiggle 2.4s ease-in-out infinite" }}>{gruss.emoji}</span>
              </div>
              <div className="text-sm mt-1" style={{ color: "rgba(255,255,255,0.7)", fontStyle: "italic" }}>
                {spruch}
              </div>
              <div className="flex flex-wrap gap-2 mt-4">
                {[
                  { label: "Rezepte", value: recipes.length, emoji: "📖", go: "rezepte" },
                  { label: "Rohstoffe", value: materials.length, emoji: "🌾", go: "rohstoffe" },
                  lowStock.length ? { label: "knapp", value: lowStock.length, emoji: "⚠️", go: "rohstoffe" } : { label: "alles da", value: "", emoji: "✅", go: "rohstoffe" },
                ].map((s) => (
                  <button
                    key={s.label}
                    onClick={() => setTab(s.go)}
                    className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full transition-colors"
                    style={{ backgroundColor: "rgba(255,255,255,0.12)", color: "#fff", border: "1px solid rgba(255,255,255,0.15)" }}
                  >
                    <span>{s.emoji}</span>
                    <b>{s.value}</b>
                    <span style={{ opacity: 0.75 }}>{s.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {showQR && (
            <div className="mt-4 p-4 rounded-lg" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>
                  Neues Gerät einrichten
                </h3>
                <button onClick={() => setShowQR(false)} style={{ color: COL.inkMuted }}>
                  <X size={16} />
                </button>
              </div>
              <p className="text-sm mb-3" style={{ color: COL.inkMuted }}>
                Scan diesen Code mit der Kamera deines neuen Handys/Laptops (Safari/Chrome-App reicht) – das Gerät richtet sich
                dann automatisch ein, ganz ohne Code abzutippen.
              </p>
              <div className="flex flex-col items-center gap-3">
                <QrCode text={makeSetupUrl(config.apiKey, config.binId)} size={240} />
                <p className="text-xs text-center" style={{ color: COL.inkMuted, maxWidth: 320 }}>
                  Geht die Kamera nicht? Kopier stattdessen diesen Link und öffne ihn auf dem anderen Gerät:
                </p>
                <input
                  readOnly
                  value={makeSetupUrl(config.apiKey, config.binId)}
                  onFocus={(e) => e.target.select()}
                  style={{ ...inputStyle, width: "100%", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11 }}
                />
                <p className="text-xs text-center" style={{ color: COL.warn, maxWidth: 320 }}>
                  Achtung: Wer diesen Code/Link hat, kann auf deine Daten zugreifen – nur mit deinen eigenen Geräten teilen.
                </p>
              </div>
            </div>
          )}
        </header>

        {showVersionRecovery && (
          <VersionRecoveryPanel
            config={config}
            onClose={() => setShowVersionRecovery(false)}
            onRestore={(record) => {
              if (record.materials) setMaterials(record.materials);
              if (record.recipes) setRecipes(record.recipes);
              if (record.columnMap) setColumnMap(record.columnMap);
              setShowVersionRecovery(false);
            }}
          />
        )}

        {showBackups && (
          <div className="mb-6 p-4 rounded-lg" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-sm font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>
                Sicherungen
              </h3>
              <button onClick={() => setShowBackups(false)} style={{ color: COL.inkMuted }}>
                <X size={16} />
              </button>
            </div>
            <p className="text-xs mb-3" style={{ color: COL.inkMuted }}>

// ---------- Rohstoffe Tab ----------
function loadPicture(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file).catch(() => loadPictureViaImageElement(file));
  }
  return loadPictureViaImageElement(file);
}
function loadPictureViaImageElement(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => resolve(img);
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Bildformat wird von diesem Browser nicht unterstützt (evtl. HEIC). Bitte als JPEG/PNG exportieren oder direkt fotografieren."));
    };
    img.src = url;
  });
}
async function preprocessImage(file) {
  const pic = await loadPicture(file);
  const srcW = pic.width,
    srcH = pic.height;
  const targetWidth = 1800;
  const scale = Math.max(1, targetWidth / srcW);
  const w = Math.round(srcW * scale);
  const h = Math.round(srcH * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(pic, 0, 0, w, h);
  if (pic.close) pic.close();
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;
  const contrast = 1.5;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    let v = (gray - 128) * contrast + 128 + 15;
    v = Math.max(0, Math.min(255, v));
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(imageData, 0, 0);
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Canvas konnte kein Bild erzeugen"))), "image/png");
  });
}

function ensureTesseractLoaded() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve();
    const existing = document.querySelector('script[data-tesseract-loader]');
    if (existing) {
      existing.addEventListener("load", () => resolve());
      existing.addEventListener("error", () => reject(new Error("Tesseract laden fehlgeschlagen")));
      return;
    }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.setAttribute("data-tesseract-loader", "1");
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Tesseract laden fehlgeschlagen"));
    document.head.appendChild(s);
  });
}

function InvoiceScanPanel({ materials, setMaterials, onClose }) {
  const [status, setStatus] = useState("idle"); // idle | scanning | done | error
  const [progress, setProgress] = useState(0);
  const [items, setItems] = useState([]);
  const [rawText, setRawText] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const [debugInfo, setDebugInfo] = useState("");
  const fileInputRef = React.useRef(null);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setStatus("preparing");
    setProgress(0);
    setErrorMsg("");
    setDebugInfo("");
    const withTimeout = (promise, ms, label) =>
      Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(`Zeitüberschreitung bei: ${label}`)), ms)),
      ]);
    try {
      let processedBlob;
      try {
        processedBlob = await withTimeout(preprocessImage(file), 15000, "Bildvorbereitung");
      } catch (err) {
        setDebugInfo("Bildvorbereitung fehlgeschlagen: " + (err?.message || String(err)));
        processedBlob = file; // Fallback: Original-Datei direkt verwenden
      }
      setStatus("scanning");
      await withTimeout(ensureTesseractLoaded(), 20000, "Tesseract laden");
      const worker = await withTimeout(
        Tesseract.createWorker("deu", 1, {
          logger: (m) => {
            if (m.status === "recognizing text") setProgress(Math.round(m.progress * 100));
          },
        }),
        30000,
        "Worker erstellen"
      );
      await worker.setParameters({ tessedit_pageseg_mode: "6" });
      const result = await withTimeout(worker.recognize(processedBlob), 60000, "Texterkennung");
      await worker.terminate();
      setRawText(result.data.text);
      const parsed = parseInvoiceText(result.data.text, materials);
      setItems(parsed);
      setStatus(parsed.length > 0 ? "done" : "error");
      if (parsed.length === 0) setErrorMsg("Es konnten keine Zeilen mit Namen + Preis erkannt werden. Roh-Text unten prüfen.");
    } catch (err) {
      setStatus("error");
      setErrorMsg("Texterkennung fehlgeschlagen.");
      setDebugInfo((prev) => (prev ? prev + " | " : "") + (err?.message || String(err)));
    }
  };

  const updateItem = (id, patch) => setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...patch } : it)));

  const applyChanges = () => {
    const toApply = items.filter((it) => (it.uebernehmenPreis || it.uebernehmenMenge) && it.materialId);
    if (toApply.length === 0) return;
    setMaterials((prev) =>
      prev.map((m) => {
        const match = toApply.find((it) => it.materialId === m.id);
        if (!match) return m;
        let updated = { ...m };
        if (match.uebernehmenPreis) {
          const priceG = match.preis / 1000; // erkannter Preis gilt als Preis pro kg
          updated.price = Math.round(priceG * 10000) / 10000;
        }
        if (match.uebernehmenMenge && match.mengeGekauft) {
          const converted = convertQty(match.mengeGekauft, match.mengeEinheit, m.unit);
          if (converted != null) {
            updated.stock = Math.round((m.stock + converted) * 1000) / 1000;
          }
        }
        return updated;
      })
    );
    onClose();
  };

  return (
    <div className="mb-5 p-4 rounded-lg" style={{ backgroundColor: COL.bg, border: `1px solid ${COL.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>
          Rechnung scannen
        </h3>
        <button onClick={onClose} style={{ color: COL.inkMuted }}>
          <X size={16} />
        </button>
      </div>

      {status === "idle" && (
        <div>
          <p className="text-sm mb-3" style={{ color: COL.inkMuted }}>
            Foto der Rechnung aufnehmen oder aus der Galerie wählen. Preise und Rohstoffe werden danach zur Kontrolle angezeigt,
            bevor irgendetwas übernommen wird.
          </p>
          <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
          <button
            onClick={() => fileInputRef.current?.click()}
            className="text-sm font-medium px-3 py-2 rounded-lg"
            style={{ backgroundColor: COL.accent, color: "#fff" }}
          >
            Rechnungsfoto auswählen
          </button>
        </div>
      )}

      {status === "preparing" && (
        <div className="text-sm" style={{ color: COL.inkMuted }}>
          Bild wird für die Erkennung optimiert…
        </div>
      )}

      {status === "scanning" && (
        <div className="text-sm" style={{ color: COL.inkMuted }}>
          Texterkennung läuft… {progress}%
        </div>
      )}

      {status === "error" && (
        <div className="flex flex-col gap-3">
          <div className="text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
            {errorMsg}
          </div>
          {debugInfo && (
            <div className="text-xs px-3 py-2 rounded-lg" style={{ backgroundColor: COL.bg, color: COL.inkMuted, fontFamily: "'IBM Plex Mono', monospace" }}>
              Technische Details: {debugInfo}
            </div>
          )}
          {rawText && (
            <details className="text-xs" style={{ color: COL.inkMuted }}>
              <summary>Erkannter Roh-Text anzeigen</summary>
              <pre className="whitespace-pre-wrap mt-2">{rawText}</pre>
            </details>
          )}
          <button onClick={() => setStatus("idle")} className="text-sm font-medium underline w-fit" style={{ color: COL.accent }}>
            Erneut versuchen
          </button>
        </div>
      )}

      {status === "done" && (
        <div className="flex flex-col gap-3">
          <p className="text-xs" style={{ color: COL.inkMuted }}>
            {items.length} Zeile(n) erkannt. Nicht sicher zugeordnete Rohstoffe sind mit ⚠ markiert – bitte manuell auswählen oder
            abhaken, um sie zu überspringen. "Preis" gilt als Preis pro kg und wird automatisch auf Preis/g umgerechnet.
          </p>
          <div className="overflow-x-auto">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["", "Erkannter Text", "Preis/kg (€)", "", "Menge gekauft", "", "Rohstoff", ""].map((h, i) => (
                    <th
                      key={i}
                      className="text-left py-1.5 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {items.map((it) => (
                  <tr key={it.id} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                    <td className="py-1.5 px-2">
                      <input
                        type="checkbox"
                        checked={it.uebernehmenPreis}
                        onChange={(e) => updateItem(it.id, { uebernehmenPreis: e.target.checked })}
                        title="Preis übernehmen"
                      />
                    </td>
                    <td className="py-1.5 px-2 text-xs" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                      {it.erkannterName}
                    </td>
                    <td className="py-1.5 px-2">
                      <input
                        style={{ ...inputStyle, width: 80, padding: "4px 8px" }}
                        type="number"
                        step="0.01"
                        value={it.preis}
                        onChange={(e) => updateItem(it.id, { preis: Number(e.target.value) })}
                      />
                    </td>
                    <td className="py-1.5 px-2">
                      <input
                        type="checkbox"
                        checked={it.uebernehmenMenge}
                        onChange={(e) => updateItem(it.id, { uebernehmenMenge: e.target.checked })}
                        title="Bestand erhöhen"
                      />
                    </td>
                    <td className="py-1.5 px-2">
                      <div className="flex items-center gap-1">
                        <input
                          style={{ ...inputStyle, width: 70, padding: "4px 8px" }}
                          type="number"
                          step="0.01"
                          placeholder="–"
                          value={it.mengeGekauft ?? ""}
                          onChange={(e) => updateItem(it.id, { mengeGekauft: e.target.value === "" ? null : Number(e.target.value) })}
                        />
                        <select
                          style={{ ...inputStyle, padding: "4px 4px", width: 60 }}
                          value={it.mengeEinheit || "kg"}
                          onChange={(e) => updateItem(it.id, { mengeEinheit: e.target.value })}
                        >
                          {UNITS.map((u) => (
                            <option key={u} value={u.toLowerCase()}>
                              {u}
                            </option>
                          ))}
                        </select>
                      </div>
                    </td>
                    <td className="py-1.5 px-2">
                      <select
                        style={{ ...inputStyle, padding: "4px 8px", fontFamily: "'IBM Plex Sans', sans-serif" }}
                        value={it.materialId}
                        onChange={(e) => updateItem(it.id, { materialId: e.target.value })}
                      >
                        <option value="">– auswählen –</option>
                        {materials.map((m) => (
                          <option key={m.id} value={m.id}>
                            {m.name}
                          </option>
                        ))}
                      </select>
                    </td>
                    <td className="py-1.5 px-2">
                      {!it.materialId && (
                        <span title="Kein Rohstoff zugeordnet" style={{ color: COL.warn }}>
                          <AlertTriangle size={16} />
                        </span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <details className="text-xs" style={{ color: COL.inkMuted }}>
            <summary>Erkannter Roh-Text anzeigen</summary>
            <pre className="whitespace-pre-wrap mt-2">{rawText}</pre>
          </details>
          <div className="flex gap-2">
            <button onClick={applyChanges} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
              Ausgewählte Preise & Mengen übernehmen
            </button>
            <button onClick={onClose} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}` }}>
              Abbrechen

        </div>
      )}
    </div>
  );

  const [form, setForm] = useState(null);
  const [search, setSearch] = useState("");
