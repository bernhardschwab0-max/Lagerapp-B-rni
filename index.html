}

function RezepteTab({ materials, recipes, setRecipes }) {
  const emptyForm = { name: "", kategorie: "", ausbringungMenge: "1", ausbringungEinheit: "Ansatz", stueckProAnsatz: "1", teiggewicht: "", backen: "", anleitung: "", items: [] };
  const categories = useMemo(
    () => [...new Set(recipes.map((r) => r.kategorie).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de")),
    [recipes]
  );
  const [filterKategorie, setFilterKategorie] = useState("Alle");
  const [suche, setSuche] = useState("");
  const [openId, setOpenId] = useState(null);
  const [form, setForm] = useState(null);

  const q = suche.trim().toLowerCase();
  const visibleRecipes = recipes
    .filter((r) => filterKategorie === "Alle" || r.kategorie === filterKategorie)
    .filter(
      (r) =>
        !q ||
        r.name.toLowerCase().includes(q) ||
        r.items.some((it) => (materials.find((m) => m.id === it.materialId)?.name || "").toLowerCase().includes(q))
    );

  const sortedMaterials = useMemo(() => [...materials].sort((a, b) => a.name.localeCompare(b.name, "de")), [materials]);

  const startAdd = () => setForm({ ...emptyForm, items: [{ materialId: sortedMaterials[0]?.id ?? "", menge: "", gruppe: "" }] });
  const startEdit = (r) =>
    setForm({
      ...emptyForm,
      ...r,
      ausbringungMenge: String(r.ausbringungMenge),
      stueckProAnsatz: String(r.stueckProAnsatz ?? ""),
      items: r.items.map((i) => ({ ...i, menge: String(i.menge), gruppe: i.gruppe || "" })),
    });
  const cancel = () => setForm(null);

  const addRow = () => {
    const lastGruppe = form.items[form.items.length - 1]?.gruppe || "";
    setForm({ ...form, items: [...form.items, { materialId: sortedMaterials[0]?.id ?? "", menge: "", gruppe: lastGruppe }] });
  };
  const removeRow = (idx) => setForm({ ...form, items: form.items.filter((_, i) => i !== idx) });
  const updateRow = (idx, patch) =>
    setForm({ ...form, items: form.items.map((it, i) => (i === idx ? { ...it, ...patch } : it)) });

  const save = () => {
    if (!form.name.trim() || form.items.length === 0) return;
    const clean = {
      ...form,
      ausbringungMenge: Number(form.ausbringungMenge) || 0,
      stueckProAnsatz: Number(form.stueckProAnsatz) || 0,
      items: form.items
        .filter((i) => i.materialId)
        .map((i) => {
          const item = { materialId: i.materialId, menge: Number(i.menge) || 0 };
          if (i.gruppe && i.gruppe.trim()) item.gruppe = i.gruppe.trim();
          return item;
        }),
    };
    if (form.id) {
      setRecipes((prev) => prev.map((r) => (r.id === form.id ? clean : r)));
    } else {
      const id = uid();
      setRecipes((prev) => [...prev, { ...clean, id }]);
      setOpenId(id);
    }
    setForm(null);
  };

  const remove = (r) => {
    if (!window.confirm(`Rezept "${r.name}" wirklich löschen?`)) return;
    setRecipes((prev) => prev.filter((x) => x.id !== r.id));
  };
  const matUnit = (id) => materials.find((m) => m.id === id)?.unit ?? "";
  const gruppenVorschlaege = [...new Set(recipes.flatMap((r) => r.items.map((i) => i.gruppe)).filter(Boolean))];

  const formPanel = !form ? null : (
    <div className="mb-5 p-4 rounded-2xl" style={{ backgroundColor: COL.surface, border: `2px solid ${COL.accent}` }}>
      <h3 className="text-lg mb-3" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
        {form.id ? `✏️ ${form.name || "Rezept"} bearbeiten` : "✨ Neues Rezept"}
      </h3>
      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-3">
        <Field label="Rezeptname">
          <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </Field>
        <Field label="Kategorie">
          <input
            style={inputStyle}
            list="kategorie-liste"
            value={form.kategorie}
            onChange={(e) => setForm({ ...form, kategorie: e.target.value })}
            placeholder="z.B. Brot"
          />
          <datalist id="kategorie-liste">
            {categories.map((c) => (
              <option key={c} value={c} />
            ))}
          </datalist>
        </Field>
        <Field label="Ausbringung (Menge)">
          <input
            style={inputStyle}
            type="number"
            step="0.01"
            value={form.ausbringungMenge}
            onChange={(e) => setForm({ ...form, ausbringungMenge: e.target.value })}
          />
        </Field>
        <Field label="Einheit der Ausbringung">
          <select
            style={inputStyle}
            value={form.ausbringungEinheit}
            onChange={(e) => setForm({ ...form, ausbringungEinheit: e.target.value })}
          >
            {["Ansatz", ...UNITS, "Portion(en)"].map((u) => (
              <option key={u} value={u}>
                {u}
              </option>
            ))}
          </select>
        </Field>
        <Field label="Stück pro Ansatz">
          <input style={inputStyle} type="number" step="1" value={form.stueckProAnsatz} onChange={(e) => setForm({ ...form, stueckProAnsatz: e.target.value })} />
        </Field>
        <Field label="Teiggewicht">
          <input style={inputStyle} value={form.teiggewicht} onChange={(e) => setForm({ ...form, teiggewicht: e.target.value })} placeholder="z.B. 850 g" />
        </Field>
        <div className="sm:col-span-2">
          <Field label="Backen">
            <input style={{ ...inputStyle, width: "100%" }} value={form.backen} onChange={(e) => setForm({ ...form, backen: e.target.value })} placeholder="z.B. 180 °C · ca. 45 min" />
          </Field>
        </div>
      </div>

      <span className="text-sm block mb-2" style={{ color: COL.inkMuted }}>
        Zutaten (pro Ansatz) – „Abschnitt“ ist optional, z.B. Vorteig, Hauptteig, Streusel
      </span>
      <datalist id="gruppen-liste">
        {gruppenVorschlaege.map((g) => (
          <option key={g} value={g} />
        ))}
      </datalist>
      <div className="flex flex-col gap-2 mb-3">
        {form.items.map((it, idx) => (
          <div key={idx} className="flex flex-wrap sm:flex-nowrap items-center gap-2 p-2 sm:p-0 rounded-lg" style={{ backgroundColor: "transparent" }}>
            <input
              style={{ ...inputStyle, width: 130 }}
              list="gruppen-liste"
              placeholder="Abschnitt"
              value={it.gruppe || ""}
              onChange={(e) => updateRow(idx, { gruppe: e.target.value })}
            />
            <select
              style={{ ...inputStyle, flex: 2, minWidth: 150 }}
              value={it.materialId}
              onChange={(e) => updateRow(idx, { materialId: e.target.value })}
            >
              {sortedMaterials.map((m) => (
                <option key={m.id} value={m.id}>
                  {m.name}
                </option>
              ))}
            </select>
            <input
              style={{ ...inputStyle, width: 90 }}
              type="number"
              step="0.001"
              placeholder="Menge"
              value={it.menge}
              onChange={(e) => updateRow(idx, { menge: e.target.value })}
            />
            <span className="text-xs w-6" style={{ color: COL.inkMuted }}>
              {matUnit(it.materialId)}
            </span>
            <button onClick={() => removeRow(idx)} style={{ color: COL.warn }} aria-label="Zutat entfernen">
              <X size={16} />
            </button>
          </div>
        ))}
      </div>
      <button onClick={addRow} className="text-sm font-medium mb-4 flex items-center gap-1" style={{ color: COL.accent }}>
        <Plus size={14} /> Zutat hinzufügen
      </button>

      <Field label="Anleitung / Notizen">
        <textarea
          style={{ ...inputStyle, minHeight: 90, resize: "vertical" }}
          value={form.anleitung}
          onChange={(e) => setForm({ ...form, anleitung: e.target.value })}
        />
      </Field>

      <div className="flex gap-2 mt-4">
        <button onClick={save} className="text-sm font-medium px-4 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
          Speichern
        </button>
        <button onClick={cancel} className="text-sm font-medium px-4 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}` }}>
          Abbrechen
        </button>
      </div>
    </div>
  );

  const katButton = (k, label, count) => {
    const on = filterKategorie === k;
    return (
      <button
        key={k}
        onClick={() => setFilterKategorie(k)}
        className="flex items-center gap-1.5 text-sm font-medium px-3 py-1.5 rounded-full whitespace-nowrap transition-all"
        style={{
          backgroundColor: on ? COL.ink : COL.surface,
          color: on ? "#fff" : COL.ink,
          border: `1px solid ${on ? COL.ink : COL.line}`,
        }}
      >
        {label}
        <span className="text-xs" style={{ opacity: 0.6 }}>
          {count}
        </span>
      </button>
    );
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between gap-3">
        <div>
          <h2 className="text-2xl" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700 }}>
            Rezepte
          </h2>
          <p className="text-sm" style={{ color: COL.inkMuted }}>
            Tippen zum Aufklappen · Menge mit ×2, ×5 … hochrechnen
          </p>
        </div>
        {!form && materials.length > 0 && (
          <button
            onClick={startAdd}
            className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg flex-shrink-0"
            style={{ backgroundColor: COL.accent, color: "#fff", boxShadow: "0 2px 8px rgba(196,98,45,0.35)" }}
          >
            <Plus size={15} /> Neues Rezept
          </button>
        )}
      </div>

      {form && !form.id && formPanel}

      <div className="relative">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-base" style={{ opacity: 0.6 }}>
          🔍
        </span>
        <input
          style={{ ...inputStyle, width: "100%", paddingLeft: 36, paddingTop: 11, paddingBottom: 11, borderRadius: 14, fontSize: 15 }}
          placeholder="Rezept oder Zutat suchen …"
          value={suche}
          onChange={(e) => setSuche(e.target.value)}
        />
      </div>

      {categories.length > 0 && (
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1" style={{ scrollbarWidth: "none" }}>
          {katButton("Alle", "Alle", recipes.length)}
          {categories.map((c) => katButton(c, `${katEmoji(c)} ${c}`, recipes.filter((r) => r.kategorie === c).length))}
        </div>
      )}

      {recipes.length === 0 ? (
        <Card>
          <p className="text-sm py-8 text-center" style={{ color: COL.inkMuted }}>
            🥣 Noch keine Rezepte erfasst.
          </p>
        </Card>
      ) : visibleRecipes.length === 0 ? (
        <Card>
          <p className="text-sm py-8 text-center" style={{ color: COL.inkMuted }}>
            🤷 Nichts gefunden für „{suche}“.
          </p>
        </Card>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {visibleRecipes.map((r) =>
            form && form.id === r.id ? (
              <div key={r.id} style={{ gridColumn: "1 / -1" }}>
                {formPanel}
              </div>
            ) : (
              <RecipeCard
                key={r.id}
                r={r}
                materials={materials}
                open={openId === r.id}
                onToggle={() => setOpenId(openId === r.id ? null : r.id)}
                onEdit={() => startEdit(r)}
                onDelete={() => remove(r)}
              />
            )
          )}
        </div>
      )}
    </div>
  );
}

// ---------- Kalkulation Tab ----------
function KalkulationTab({ materials, setMaterials, recipes, orderHistory, setOrderHistory }) {
  const [mode, setMode] = useState("rezept"); // rezept | direkt
  const [recipeId, setRecipeId] = useState(recipes[0]?.id ?? "");
  const [targetQty, setTargetQty] = useState("");
  const [applied, setApplied] = useState(false);
  const [direktRows, setDirektRows] = useState([{ id: uid(), materialId: materials[0]?.id ?? "", menge: "" }]);

  const recipe = recipes.find((r) => r.id === recipeId);
  const scale = recipe && Number(targetQty) > 0 && recipe.ausbringungMenge > 0 ? Number(targetQty) / recipe.ausbringungMenge : 0;

  const rows = useMemo(() => {
    if (!recipe) return [];
    const expandedItems = expandVorteige(recipe.items, materials);
    return expandedItems.map((it) => {
      const mat = materials.find((m) => m.id === it.materialId);
      const needed = it.menge * scale;
      const cost = mat ? needed * mat.price : 0;
      const enough = mat ? mat.stock >= needed : false;
      return { materialId: it.materialId, mat, needed, cost, enough };
    });
  }, [recipe, materials, scale]);

  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  const anyMissing = rows.some((r) => !r.enough);

  const addDirektRow = () => setDirektRows([...direktRows, { id: uid(), materialId: materials[0]?.id ?? "", menge: "" }]);
  const removeDirektRow = (id) => setDirektRows(direktRows.filter((r) => r.id !== id));
  const updateDirektRow = (id, patch) => setDirektRows(direktRows.map((r) => (r.id === id ? { ...r, ...patch } : r)));

  const direktConsolidated = useMemo(() => {
    return direktRows
      .filter((r) => r.materialId && Number(r.menge) > 0)
      .map((r) => {
        const mat = materials.find((m) => m.id === r.materialId);
        const needed = Number(r.menge);
        return { materialId: r.materialId, mat, needed, enough: mat ? mat.stock >= needed : false };
      });
  }, [direktRows, materials]);

  const logHistory = (label, items) => {
    const historyEntry = {
      id: uid(),
      appliedAt: new Date().toISOString(),
      label,
      items: items.map((it) => ({ materialId: it.materialId, needed: it.needed })),
    };
    setOrderHistory((prev) => [historyEntry, ...prev].slice(0, 50));
  };

  const applyRezeptAbzug = () => {
    if (rows.length === 0) return;
    setMaterials((prev) =>
      prev.map((m) => {
        const r = rows.find((r) => r.materialId === m.id);
        return r ? { ...m, stock: Math.round((m.stock - r.needed) * 1000) / 1000 } : m;
      })
    );
    logHistory(`Gebacken: ${recipe.name} (${fmtNum(Number(targetQty))} ${recipe.ausbringungEinheit})`, rows);
    setApplied(true);
  };

  const applyDirektAbzug = () => {
    if (direktConsolidated.length === 0) return;
    setMaterials((prev) =>
      prev.map((m) => {
        const r = direktConsolidated.find((r) => r.materialId === m.id);
        return r ? { ...m, stock: Math.round((m.stock - r.needed) * 1000) / 1000 } : m;
      })
    );
    logHistory("Rohstoffe direkt abgezogen", direktConsolidated);
    setApplied(true);
    setDirektRows([{ id: uid(), materialId: materials[0]?.id ?? "", menge: "" }]);
  };

  return (
    <div className="flex flex-col gap-4">
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
            Backen / Verbrauch buchen
          </h2>
          <div className="flex gap-1 p-1 rounded-lg" style={{ backgroundColor: COL.bg }}>
            <button
              onClick={() => {
                setMode("rezept");
                setApplied(false);
              }}
              className="text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
              style={{ backgroundColor: mode === "rezept" ? COL.accent : "transparent", color: mode === "rezept" ? "#fff" : COL.inkMuted }}
            >
              Nach Rezept
            </button>
            <button
              onClick={() => {
                setMode("direkt");
                setApplied(false);
              }}
              className="text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
              style={{ backgroundColor: mode === "direkt" ? COL.accent : "transparent", color: mode === "direkt" ? "#fff" : COL.inkMuted }}
            >
              Rohstoffe direkt
            </button>
          </div>
        </div>

        {mode === "rezept" && (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
            <Field label="Rezept">
              <select
                style={inputStyle}
                value={recipeId}
                onChange={(e) => {
                  setRecipeId(e.target.value);
                  setApplied(false);
                }}
              >
                {groupByKategorie(recipes).map((g) => (
                  <optgroup key={g.kategorie} label={g.kategorie}>
                    {g.items.map((r) => (
                      <option key={r.id} value={r.id}>
                        {r.name}
                      </option>
                    ))}
                  </optgroup>
                ))}
              </select>
            </Field>
            <Field label={`Produzierte Menge${recipe ? " (" + recipe.ausbringungEinheit + ")" : ""}`}>
              <input
                style={inputStyle}
                type="number"
                step="0.01"
                value={targetQty}
                onChange={(e) => {
                  setTargetQty(e.target.value);
                  setApplied(false);
                }}
                placeholder={recipe ? `z.B. ${recipe.ausbringungMenge}` : ""}
              />
            </Field>
          </div>
        )}

        {mode === "direkt" && (
          <div className="flex flex-col gap-2">
            <p className="text-sm mb-1" style={{ color: COL.inkMuted }}>
              Rohstoff(e) und verbrauchte Menge direkt eintragen, ohne über ein Rezept zu rechnen.
            </p>
            {direktRows.map((row) => (
              <div key={row.id} className="flex items-center gap-2">
                <select
                  style={{ ...inputStyle, flex: 2 }}
                  value={row.materialId}
                  onChange={(e) => {
                    updateDirektRow(row.id, { materialId: e.target.value });
                    setApplied(false);
                  }}
                >
                  {materials.map((m) => (
                    <option key={m.id} value={m.id}>
                      {m.name}
                    </option>
                  ))}
                </select>
                <input
                  style={{ ...inputStyle, flex: 1 }}
                  type="number"
                  step="0.01"
                  placeholder="Menge"
                  value={row.menge}
                  onChange={(e) => {
                    updateDirektRow(row.id, { menge: e.target.value });
                    setApplied(false);
                  }}
                />
                <span className="text-xs w-8" style={{ color: COL.inkMuted }}>
                  {materials.find((m) => m.id === row.materialId)?.unit || ""}
                </span>
                <button onClick={() => removeDirektRow(row.id)} style={{ color: COL.warn }}>
                  <X size={16} />
                </button>
              </div>
            ))}
            <button onClick={addDirektRow} className="text-sm font-medium mt-1 flex items-center gap-1 w-fit" style={{ color: COL.accent }}>
              <Plus size={14} /> Weiterer Rohstoff
            </button>
          </div>
        )}
      </Card>

      {mode === "rezept" && recipe && scale > 0 && (
        <Card>
          <div className="overflow-x-auto mb-4">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["Rohstoff", "Benötigt", "Lager", "Status", "Kosten"].map((h) => (
                    <th
                      key={h}
                      className="text-left py-2 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                    <td className="py-2 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                      {r.mat?.name ?? "(gelöscht)"}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(r.needed)} {r.mat?.unit}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(r.mat?.stock ?? 0)} {r.mat?.unit}
                    </td>
                    <td className="py-2 px-2">
                      {r.enough ? (
                        <span className="flex items-center gap-1 text-xs px-2 py-0.5 rounded-full w-fit" style={{ backgroundColor: COL.okSoft, color: COL.ok, fontFamily: "'IBM Plex Sans', sans-serif" }}>
                          <CheckCircle2 size={12} /> genug
                        </span>
                      ) : (
                        <span className="flex items-center gap-1 text-xs px-2 py-0.5 rounded-full w-fit" style={{ backgroundColor: COL.warnSoft, color: COL.warn, fontFamily: "'IBM Plex Sans', sans-serif" }}>
                          <AlertTriangle size={12} /> fehlen {fmtNum(r.needed - (r.mat?.stock ?? 0))} {r.mat?.unit}
                        </span>
                      )}
                    </td>
                    <td className="py-2 px-2">{fmtEUR(r.cost)}</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr>
                  <td colSpan={4} className="py-3 px-2 text-right font-medium" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                    Gesamtkosten Rohstoffe
                  </td>
                  <td className="py-3 px-2 font-semibold" style={{ fontSize: "15px" }}>
                    {fmtEUR(totalCost)}
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
          {anyMissing ? (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg mb-3" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
              <AlertTriangle size={16} /> Für diese Menge reicht der Lagerbestand nicht bei allen Rohstoffen aus.
            </div>
          ) : (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg mb-3" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
              <CheckCircle2 size={16} /> Der Lagerbestand reicht für die geplante Produktion aus.
            </div>
          )}
          {applied ? (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
              <CheckCircle2 size={16} /> Lagerbestand aktualisiert.
            </div>
          ) : (
            <button onClick={applyRezeptAbzug} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
              Bestand jetzt abziehen
            </button>
          )}
        </Card>
      )}

      {mode === "direkt" && direktConsolidated.length > 0 && (
        <Card>
          <div className="overflow-x-auto mb-4">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["Rohstoff", "Menge", "Lager", "Nach Abzug"].map((h) => (
                    <th
                      key={h}
                      className="text-left py-2 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {direktConsolidated.map((r, i) => (
                  <tr key={i} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                    <td className="py-2 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                      {r.mat?.name}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(r.needed)} {r.mat?.unit}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(r.mat?.stock ?? 0)} {r.mat?.unit}
                    </td>
                    <td
                      className="py-2 px-2"
                      style={{ color: !r.enough ? COL.warn : COL.ink, fontWeight: !r.enough ? 600 : 400 }}
                    >
                      {fmtNum((r.mat?.stock ?? 0) - r.needed)} {r.mat?.unit}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {direktConsolidated.some((r) => !r.enough) && (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg mb-3" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
              <AlertTriangle size={16} /> Für manche Rohstoffe reicht der Bestand nicht aus – der Abzug würde ins Minus gehen.
            </div>
          )}
          {applied ? (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
              <CheckCircle2 size={16} /> Lagerbestand aktualisiert.
            </div>
          ) : (
            <button onClick={applyDirektAbzug} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
              Bestand jetzt abziehen
            </button>
          )}
        </Card>
      )}
    </div>
  );
}

// ---------- Etikett Tab ----------
function EtikettTab({ materials, recipes }) {
  const [recipeId, setRecipeId] = useState(recipes[0]?.id ?? "");
  const recipe = recipes.find((r) => r.id === recipeId);

  const items = useMemo(() => {
    if (!recipe) return [];
    // Gleiche Zutat aus mehreren Abschnitten (z.B. Wasser im Vorteig und Hauptteig) nur einmal aufs Etikett
    const summe = new Map();
    recipe.items.forEach((it) => summe.set(it.materialId, (summe.get(it.materialId) || 0) + (Number(it.menge) || 0)));
    return [...summe.entries()]
      .map(([materialId, menge]) => ({ materialId, menge, mat: materials.find((m) => m.id === materialId) }))
      .filter((it) => it.mat)
      .sort((a, b) => b.menge - a.menge);
  }, [recipe, materials]);

  const allergenKeys = useMemo(() => {
    const set = new Set();
    items.forEach((it) => it.mat.allergene.forEach((a) => set.add(a)));
    return [...set];
  }, [items]);

  const additives = items.filter((it) => it.mat.zusatzstoffe?.trim());

  return (
    <div className="flex flex-col gap-4">
      <Card>
        <Field label="Rezept für Etikett wählen">
          <select style={{ ...inputStyle, maxWidth: 320 }} value={recipeId} onChange={(e) => setRecipeId(e.target.value)}>
            {groupByKategorie(recipes).map((g) => (
              <optgroup key={g.kategorie} label={g.kategorie}>
                {g.items.map((r) => (
                  <option key={r.id} value={r.id}>
                    {r.name}
                  </option>
                ))}
              </optgroup>
            ))}
          </select>
        </Field>
      </Card>

      {recipe && (
        <div className="relative mx-auto w-full max-w-md">
          <div
            className="relative rounded-2xl p-6"
            style={{ backgroundColor: "#fff", border: `2px dashed ${COL.line}` }}
          >
            {/* ticket notches */}
            <div className="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full" style={{ backgroundColor: COL.bg }} />
            <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full" style={{ backgroundColor: COL.bg }} />

            <div className="text-center mb-4">
              <h3 className="text-xl" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700 }}>
                {recipe.name}
              </h3>
              <p className="text-xs" style={{ color: COL.inkMuted }}>
                Ausbringung: {fmtNum(recipe.ausbringungMenge)} {recipe.ausbringungEinheit}
              </p>
            </div>

            <div className="mb-4">
              <p className="text-xs font-semibold uppercase mb-1" style={{ color: COL.inkMuted, letterSpacing: "0.05em" }}>
                Zutaten
              </p>
              <p className="text-sm leading-relaxed" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                {items.map((it, i) => {
                  const hasAllergen = it.mat.allergene.length > 0;
                  return (
                    <span key={i}>
                      <span style={{ fontWeight: hasAllergen ? 700 : 400, textTransform: hasAllergen ? "uppercase" : "none" }}>
                        {it.mat.name}
                      </span>
                      {it.mat.zusatzstoffe?.trim() && <span> ({it.mat.zusatzstoffe.trim()})</span>}
                      {i < items.length - 1 ? ", " : "."}
                    </span>
                  );
                })}
              </p>
            </div>

            {allergenKeys.length > 0 && (
              <div className="mb-3 p-3 rounded-lg" style={{ backgroundColor: COL.amberSoft }}>
                <p className="text-xs font-semibold mb-1" style={{ color: COL.amber }}>
                  Enthält Allergene:
                </p>
                <p className="text-sm font-semibold" style={{ color: COL.amber }}>
                  {allergenKeys.map(allergenLabel).join(", ")}
                </p>
              </div>
            )}

            {additives.length > 0 && (
              <div className="mb-1">
                <p className="text-xs font-semibold uppercase mb-1" style={{ color: COL.inkMuted, letterSpacing: "0.05em" }}>
                  Zusatzstoffe
                </p>
                <ul className="text-xs" style={{ color: COL.inkMuted }}>
                  {additives.map((it, i) => (
                    <li key={i}>
                      {it.mat.name}: {it.mat.zusatzstoffe}
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {allergenKeys.length === 0 && (
              <p className="text-xs" style={{ color: COL.ok }}>
                Keine deklarierten Allergene enthalten.
              </p>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Bestellung: Hilfsfunktionen (Kunden-Matrix-Format) ----------
function ensureXLSXLoaded() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) return resolve();
    const existing = document.querySelector('script[data-xlsx-loader]');
    if (existing) {
      existing.addEventListener("load", () => resolve());
      existing.addEventListener("error", () => reject(new Error("XLSX-Bibliothek laden fehlgeschlagen")));
      return;
    }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.setAttribute("data-xlsx-loader", "1");
    s.crossOrigin = "anonymous";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("XLSX-Bibliothek laden fehlgeschlagen"));
    document.head.appendChild(s);
  });
}

function excelSerialToDate(n) {
  return new Date(Math.round((n - 25569) * 86400 * 1000));
}

function detectOrderBlocks(rows) {
  let headerRowIdx = -1;
  let anchors = [];
  for (let r = 0; r < Math.min(rows.length, 10); r++) {
    const row = rows[r] || [];
    const found = [];
    row.forEach((cell, ci) => {
      if (String(cell).trim() === "Bauern") found.push(ci);
    });
    if (found.length > 0) {
      headerRowIdx = r;
      anchors = found;
      break;
    }
  }
  if (headerRowIdx === -1) return { blocks: [], headerRowIdx: -1 };
  const headerRow = rows[headerRowIdx] || [];

  const blocks = anchors.map((a, blockIdx) => {
    const nameCol = a - 1;
    const nextAnchor = anchors[blockIdx + 1];
    const hardLimit = nextAnchor != null ? nextAnchor - 1 : headerRow.length;
    const productCols = [];
    const productNames = [];
    for (let c = a; c < hardLimit; c++) {
      const label = headerRow[c];
      if (label === undefined || label === null || String(label).trim() === "") break;
      productCols.push(c);
      productNames.push(String(label).trim());
    }
    let date = null;
    const lastCol = productCols.length > 0 ? productCols[productCols.length - 1] : a;
    for (let r = 0; r < headerRowIdx && !date; r++) {
      const row = rows[r] || [];
      for (let c = Math.max(0, nameCol); c <= lastCol + 2; c++) {
        const val = row[c];
        if (val instanceof Date) {
          date = val;
          break;
        }
        if (typeof val === "number" && val > 30000 && val < 60000) {
          date = excelSerialToDate(val);
          break;
        }
        if (typeof val === "string" && /^\d{4}-\d{2}-\d{2}/.test(val.trim())) {
          date = new Date(val.trim());
          break;
        }
      }
    }
    return { id: `block${blockIdx}`, nameCol, productCols, productNames, date };
  });

  return { blocks, headerRowIdx };
}

function sumOrderBlock(rows, headerRowIdx, block) {
  const totals = {};
  block.productNames.forEach((p) => (totals[p] = 0));
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = row[block.nameCol];
    if (name === undefined || name === null || String(name).trim() === "") continue;
    block.productCols.forEach((c, i) => {
      const v = row[c];
      const n = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
      if (isFinite(n)) totals[block.productNames[i]] += n;
    });
  }
  return totals;
}

function fmtBlockDate(date) {
  if (!date || isNaN(date.getTime())) return "unbekanntes Datum";
  return date.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
}

// ---------- Bestellung Tab ----------
function BestellungTab({ materials, setMaterials, recipes, setRecipes, columnMap, setColumnMap, orderHistory, setOrderHistory }) {
  const [importMode, setImportMode] = useState("manuell"); // manuell | excel
  const [status, setStatus] = useState("idle"); // idle | parsing | pick-sheet | pick-date | mapping | done | error
  const [workbook, setWorkbook] = useState(null);
  const [sheetName, setSheetName] = useState("");
  const [rows, setRows] = useState([]);
  const [blocks, setBlocks] = useState([]);
  const [headerRowIdx, setHeaderRowIdx] = useState(-1);
  const [selectedBlockId, setSelectedBlockId] = useState("");
  const [totals, setTotals] = useState(null);
  const [products, setProducts] = useState([]);
  const [mapping, setMapping] = useState({});
  const [errorMsg, setErrorMsg] = useState("");
  const [debugInfo, setDebugInfo] = useState("");
  const fileInputRef = React.useRef(null);

  const [manualRows, setManualRows] = useState([{ id: uid(), recipeId: recipes[0]?.id ?? "", menge: "" }]);
  const [manualApplied, setManualApplied] = useState(false);
  const addManualRow = () => setManualRows([...manualRows, { id: uid(), recipeId: recipes[0]?.id ?? "", menge: "" }]);
  const removeManualRow = (id) => setManualRows(manualRows.filter((r) => r.id !== id));
  const updateManualRow = (id, patch) => {
    setManualRows(manualRows.map((r) => (r.id === id ? { ...r, ...patch } : r)));
    setManualApplied(false);
  };

  const SCHWUND_G = 1500;
  const [schwundAktiv, setSchwundAktiv] = useState(true);
  const manualConsolidated = useMemo(() => {
    const map = new Map();
    manualRows
      .filter((r) => r.recipeId && Number(r.menge) > 0)
      .forEach((r) => {
        const recipe = recipes.find((rec) => rec.id === r.recipeId);
        if (!recipe || !recipe.ausbringungMenge) return;
        const scale = Number(r.menge) / recipe.ausbringungMenge;
        const expandedItems = expandVorteige(recipe.items, materials);
        expandedItems.forEach((it) => {
          const needed = it.menge * scale;
          map.set(it.materialId, (map.get(it.materialId) || 0) + needed);
        });
      });
    const roggen = materials.find((m) => m.name.trim().toLowerCase() === "roggenmehl 960");
    const dinkel = materials.find((m) => m.name.trim().toLowerCase() === "dinkelmehl");
    const anyRealProduct = manualRows.some((r) => r.recipeId && Number(r.menge) > 0);
    if (anyRealProduct && schwundAktiv) {
      if (roggen) map.set(roggen.id, (map.get(roggen.id) || 0) + SCHWUND_G);
      if (dinkel) map.set(dinkel.id, (map.get(dinkel.id) || 0) + SCHWUND_G);
    }
    return [...map.entries()]
      .map(([materialId, needed]) => {
        const mat = materials.find((m) => m.id === materialId);
        const isSchwund = materialId === roggen?.id || materialId === dinkel?.id;
        return { materialId, mat, needed, resultingStock: (mat?.stock ?? 0) - needed, isSchwund };
      })
      .filter((c) => c.mat);
  }, [manualRows, recipes, materials, schwundAktiv]);

  const applyManualDeduction = () => {
    if (manualConsolidated.length === 0) return;
    setMaterials((prev) =>
      prev.map((m) => {
        const c = manualConsolidated.find((c) => c.materialId === m.id);
        return c ? { ...m, stock: Math.round((m.stock - c.needed) * 1000) / 1000 } : m;
      })
    );
    const namen = manualRows
      .filter((r) => r.recipeId && Number(r.menge) > 0)
      .map((r) => {
        const rec = recipes.find((rc) => rc.id === r.recipeId);
        return `${fmtNum(Number(r.menge))} ${rec?.ausbringungEinheit ?? ""} ${rec?.name ?? ""}`;
      })
      .join(", ");
    const historyEntry = {
      id: uid(),
      appliedAt: new Date().toISOString(),
      label: `Bestellung: ${namen}`,
      items: manualConsolidated.map((c) => ({ materialId: c.materialId, needed: c.needed })),
    };
    setOrderHistory((prev) => [historyEntry, ...prev].slice(0, 50));
    setManualApplied(true);
    setManualRows([{ id: uid(), recipeId: recipes[0]?.id ?? "", menge: "" }]);
  };

  const resetAll = () => {
    setStatus("idle");
    setWorkbook(null);
    setSheetName("");
    setRows([]);
    setBlocks([]);
    setSelectedBlockId("");
    setTotals(null);
    setProducts([]);
    setErrorMsg("");
  };

  const loadSheet = (wb, sName) => {
    const sheet = wb.Sheets[sName];
    const r = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
    const { blocks: detected, headerRowIdx: hIdx } = detectOrderBlocks(r);
    setRows(r);
    setHeaderRowIdx(hIdx);
    setBlocks(detected);
    setSheetName(sName);
    if (detected.length === 0) {
      setStatus("error");
      setErrorMsg(`Im Blatt "${sName}" konnte keine Bestell-Tabelle (Spalte "Bauern") gefunden werden.`);
    } else {
      setStatus("pick-date");
    }
  };

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setStatus("parsing");
    setErrorMsg("");
    setDebugInfo("");
    try {
      await ensureXLSXLoaded();
      let wb;
      if (file.name.toLowerCase().endsWith(".csv")) {
        const text = await file.text();
        wb = XLSX.read(text, { type: "string", cellDates: true });
      } else {
        const buf = await file.arrayBuffer();
        wb = XLSX.read(buf, { type: "array", cellDates: true });
      }
      setWorkbook(wb);
      if (wb.SheetNames.length === 1) {
        loadSheet(wb, wb.SheetNames[0]);
      } else {
        setStatus("pick-sheet");
      }
    } catch (err) {
      setStatus("error");
      setErrorMsg("Datei konnte nicht gelesen werden.");
      setDebugInfo(err?.message || String(err));
    }
  };

  const chooseDate = (blockId) => {
    setSelectedBlockId(blockId);
    const block = blocks.find((b) => b.id === blockId);
    const t = sumOrderBlock(rows, headerRowIdx, block);
    setTotals(t);
    setProducts(block.productNames);
    const initMapping = {};
    block.productNames.forEach((abbr) => {
      const saved = columnMap[abbr];
      initMapping[abbr] = {
        recipeId: saved?.recipeId || "",
        stueckProAnsatz: saved?.stueckProAnsatz ?? "",
      };
      if (!initMapping[abbr].recipeId) {
        const { match } = findBestMatch(abbr, recipes, (r) => r.name);
        if (match) initMapping[abbr].recipeId = match.id;
      }
    });
    setMapping(initMapping);
    setStatus("mapping");
  };

  const updateMapping = (abbr, patch) => setMapping((prev) => ({ ...prev, [abbr]: { ...prev[abbr], ...patch } }));

  const consolidated = useMemo(() => {
    if (!totals) return [];
    const map = new Map();
    products.forEach((abbr) => {
      const qty = totals[abbr];
      const m = mapping[abbr];
      if (!qty || qty <= 0 || !m?.recipeId || !m?.stueckProAnsatz) return;
      const recipe = recipes.find((r) => r.id === m.recipeId);
      if (!recipe || !recipe.ausbringungMenge) return;
      const ansaetze = qty / Number(m.stueckProAnsatz);
      const scale = ansaetze / recipe.ausbringungMenge;
      const expandedItems = expandVorteige(recipe.items, materials);
      expandedItems.forEach((it) => {
        const needed = it.menge * scale;
        map.set(it.materialId, (map.get(it.materialId) || 0) + needed);
      });
    });
    // Optionaler Schwund-Abzug bei dieser Bestellung
    const roggen = materials.find((m) => m.name.trim().toLowerCase() === "roggenmehl 960");
    const dinkel = materials.find((m) => m.name.trim().toLowerCase() === "dinkelmehl");
    if (schwundAktiv) {
      if (roggen) map.set(roggen.id, (map.get(roggen.id) || 0) + SCHWUND_G);
      if (dinkel) map.set(dinkel.id, (map.get(dinkel.id) || 0) + SCHWUND_G);
    }

    return [...map.entries()]
      .map(([materialId, needed]) => {
        const mat = materials.find((m) => m.id === materialId);
        const isSchwund = materialId === roggen?.id || materialId === dinkel?.id;
        return { materialId, mat, needed, resultingStock: (mat?.stock ?? 0) - needed, isSchwund };
      })
      .filter((c) => c.mat);
  }, [totals, mapping, recipes, materials, products, schwundAktiv]);

  const anyNegative = consolidated.some((c) => c.resultingStock < 0);
  const unmappedActive = products.filter((abbr) => totals && totals[abbr] > 0 && !mapping[abbr]?.recipeId);
  const missingPieces = products.filter((abbr) => totals && totals[abbr] > 0 && mapping[abbr]?.recipeId && !mapping[abbr]?.stueckProAnsatz);

  const applyDeduction = () => {
    setMaterials((prev) =>
      prev.map((m) => {
        const c = consolidated.find((c) => c.materialId === m.id);
        return c ? { ...m, stock: Math.round((m.stock - c.needed) * 1000) / 1000 } : m;
      })
    );
    const newColumnMap = { ...columnMap };
    products.forEach((abbr) => {
      if (mapping[abbr]?.recipeId) newColumnMap[abbr] = { recipeId: mapping[abbr].recipeId, stueckProAnsatz: mapping[abbr].stueckProAnsatz };
    });
    setColumnMap(newColumnMap);
    const block = blocks.find((b) => b.id === selectedBlockId);
    const historyEntry = {
      id: uid(),
      appliedAt: new Date().toISOString(),
      label: `Lieferung ${fmtBlockDate(block?.date)}`,
      items: consolidated.map((c) => ({ materialId: c.materialId, needed: c.needed })),
    };
    setOrderHistory((prev) => [historyEntry, ...prev].slice(0, 50));
    setStatus("done");
  };

  const undoHistoryEntry = (entry) => {
    if (!window.confirm(`"${entry.label}" wirklich rückgängig machen? Die abgezogenen Mengen werden dem Lagerbestand wieder hinzugefügt.`))
      return;
    setMaterials((prev) =>
      prev.map((m) => {
        const item = entry.items.find((i) => i.materialId === m.id);
        return item ? { ...m, stock: Math.round((m.stock + item.needed) * 1000) / 1000 } : m;
      })
    );
    setOrderHistory((prev) => prev.filter((h) => h.id !== entry.id));
  };

  const selectedBlock = blocks.find((b) => b.id === selectedBlockId);

  return (
    <div className="flex flex-col gap-4">
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
            Bestellung
          </h2>
          <div className="flex gap-1 p-1 rounded-lg" style={{ backgroundColor: COL.bg }}>
            <button
              onClick={() => setImportMode("manuell")}
              className="text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
              style={{ backgroundColor: importMode === "manuell" ? COL.accent : "transparent", color: importMode === "manuell" ? "#fff" : COL.inkMuted }}
            >
              Manuell
            </button>
            <button
              onClick={() => setImportMode("excel")}
              className="text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
              style={{ backgroundColor: importMode === "excel" ? COL.accent : "transparent", color: importMode === "excel" ? "#fff" : COL.inkMuted }}
            >
              Excel-Datei
            </button>
          </div>
        </div>

        {importMode === "manuell" && (
          <div className="flex flex-col gap-2">
            <p className="text-sm mb-1" style={{ color: COL.inkMuted }}>
              Produkt(e) und Menge auswählen, bestätigen – fertig.
            </p>
            <label className="flex items-center gap-2 text-sm mb-1" style={{ color: COL.ink }}>
              <input type="checkbox" checked={schwundAktiv} onChange={(e) => setSchwundAktiv(e.target.checked)} />
              Schwund abziehen (1,5 kg Roggenmehl 960 + 1,5 kg Dinkelmehl)
            </label>
            {manualRows.map((row) => {
              const rec = recipes.find((r) => r.id === row.recipeId);
              return (
                <div key={row.id} className="flex items-center gap-2">
                  <select style={{ ...inputStyle, flex: 2 }} value={row.recipeId} onChange={(e) => updateManualRow(row.id, { recipeId: e.target.value })}>
                    {groupByKategorie(recipes).map((g) => (
                      <optgroup key={g.kategorie} label={g.kategorie}>
                        {g.items.map((r) => (
                          <option key={r.id} value={r.id}>
                            {r.name}
                          </option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                  <input
                    style={{ ...inputStyle, flex: 1 }}
                    type="number"
                    step="0.01"
                    placeholder="Menge"
                    value={row.menge}
                    onChange={(e) => updateManualRow(row.id, { menge: e.target.value })}
                  />
                  <span className="text-xs w-16" style={{ color: COL.inkMuted }}>
                    {rec?.ausbringungEinheit || ""}
                  </span>
                  <button onClick={() => removeManualRow(row.id)} style={{ color: COL.warn }}>
                    <X size={16} />
                  </button>
                </div>
              );
            })}
            <button onClick={addManualRow} className="text-sm font-medium mt-1 flex items-center gap-1 w-fit" style={{ color: COL.accent }}>
              <Plus size={14} /> Weiteres Produkt
            </button>
          </div>
        )}
      </Card>

      {importMode === "manuell" && manualConsolidated.length > 0 && (
        <Card>
          <div className="overflow-x-auto mb-4">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["Rohstoff", "Benötigt", "Lager", "Nach Abzug"].map((h) => (
                    <th
                      key={h}
                      className="text-left py-2 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {manualConsolidated.map((c) => (
                  <tr key={c.materialId} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                    <td className="py-2 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                      {c.mat.name}
                      {c.isSchwund && (
                        <span className="text-xs ml-2 px-1.5 py-0.5 rounded-full" style={{ backgroundColor: COL.amberSoft, color: COL.amber }}>
                          +1,5 kg Schwund
                        </span>
                      )}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(c.needed)} {c.mat.unit}
                    </td>
                    <td className="py-2 px-2">
                      {fmtNum(c.mat.stock)} {c.mat.unit}
                    </td>
                    <td className="py-2 px-2" style={{ color: c.resultingStock < 0 ? COL.warn : COL.ink, fontWeight: c.resultingStock < 0 ? 600 : 400 }}>
                      {fmtNum(c.resultingStock)} {c.mat.unit}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {manualConsolidated.some((c) => !c.isSchwund && c.resultingStock < 0) && (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg mb-3" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
              <AlertTriangle size={16} /> Für manche Rohstoffe reicht der Bestand nicht aus.
            </div>
          )}
          {manualApplied ? (
            <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
              <CheckCircle2 size={16} /> Lagerbestand aktualisiert.
            </div>
          ) : (
            <button onClick={applyManualDeduction} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
              Bestätigen
            </button>
          )}
        </Card>
      )}

      {importMode === "excel" && (
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
            Bestellung importieren
          </h2>
          {status !== "idle" && (
            <button onClick={resetAll} className="text-xs underline" style={{ color: COL.inkMuted }}>
              Neue Datei
            </button>
          )}
        </div>

        {status === "idle" && (
          <div>
            <p className="text-sm mb-3" style={{ color: COL.inkMuted }}>
              Deine Bestell-Excel hochladen (Kunden als Zeilen, Produkt-Spalten wie "Bauern", "Dinkel", …). Du wählst danach den
              Liefertag aus, ordnest die Produkte einmalig deinen Rezepten zu, und die App berechnet und zieht die Rohstoffe ab.
            </p>
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
            <button
              onClick={() => fileInputRef.current?.click()}
              className="text-sm font-medium px-3 py-2 rounded-lg"
              style={{ backgroundColor: COL.accent, color: "#fff" }}
            >
              Bestell-Datei auswählen
            </button>
          </div>
        )}

        {status === "parsing" && (
          <div className="text-sm" style={{ color: COL.inkMuted }}>
            Datei wird eingelesen…
          </div>
        )}

        {status === "pick-sheet" && workbook && (
          <div className="flex flex-col gap-3">
            <Field label="Welches Tabellenblatt (z.B. Monat)?">
              <select style={inputStyle} onChange={(e) => loadSheet(workbook, e.target.value)} defaultValue="">
                <option value="" disabled>
                  – auswählen –
                </option>
                {workbook.SheetNames.map((s) => (
                  <option key={s} value={s}>
                    {s}
                  </option>
                ))}
              </select>
            </Field>
          </div>
        )}

        {status === "pick-date" && (
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: COL.inkMuted }}>
              Blatt "{sheetName}" – {blocks.length} Liefertermin(e) gefunden. Für welchen Tag soll gerechnet werden?
            </p>
            <div className="flex flex-wrap gap-2">
              {blocks.map((b) => (
                <button
                  key={b.id}
                  onClick={() => chooseDate(b.id)}
                  className="text-sm font-medium px-3 py-2 rounded-lg"
                  style={{ border: `1px solid ${COL.accent}`, color: COL.accent }}
                >
                  {fmtBlockDate(b.date)}
                </button>
              ))}
            </div>
          </div>
        )}

        {status === "error" && (
          <div className="flex flex-col gap-3">
            <div className="text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
              {errorMsg}
            </div>
            {debugInfo && (
              <div
                className="text-xs px-3 py-2 rounded-lg"
                style={{ backgroundColor: COL.bg, color: COL.inkMuted, fontFamily: "'IBM Plex Mono', monospace" }}
              >
                Technische Details: {debugInfo}
              </div>
            )}
            <button onClick={resetAll} className="text-sm font-medium underline w-fit" style={{ color: COL.accent }}>
              Erneut versuchen
            </button>
          </div>
        )}

        {status === "mapping" && totals && (
          <div className="flex flex-col gap-5">
            <p className="text-sm" style={{ color: COL.inkMuted }}>
              Liefertag <strong>{fmtBlockDate(selectedBlock?.date)}</strong>. Ordne jedes Produkt einem Rezept zu und gib an, wie
              viele Stück ein Ansatz ergibt (nur einmalig nötig – wird gemerkt).
            </p>
            <div className="overflow-x-auto">
              <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                    {["Produkt", "Bestellt", "Rezept", "Stück/Ansatz", ""].map((h) => (
                      <th
                        key={h}
                        className="text-left py-1.5 px-2 font-medium"
                        style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                      >
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {products.filter((abbr) => totals[abbr] > 0).map((abbr) => (
                    <tr key={abbr} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                      <td className="py-1.5 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                        {abbr}
                      </td>
                      <td className="py-1.5 px-2">{fmtNum(totals[abbr])} Stk</td>
                      <td className="py-1.5 px-2">
                        <select
                          style={{ ...inputStyle, padding: "4px 8px", fontFamily: "'IBM Plex Sans', sans-serif" }}
                          value={mapping[abbr]?.recipeId || ""}
                          onChange={(e) => updateMapping(abbr, { recipeId: e.target.value })}
                        >
                          <option value="">– auswählen –</option>
                          {recipes.map((r) => (
                            <option key={r.id} value={r.id}>
                              {r.name}
                            </option>
                          ))}
                        </select>
                      </td>
                      <td className="py-1.5 px-2">
                        <input
                          style={{ ...inputStyle, width: 70, padding: "4px 8px" }}
                          type="number"
                          step="1"
                          min="1"
                          placeholder="z.B. 4"
                          value={mapping[abbr]?.stueckProAnsatz || ""}
                          onChange={(e) => updateMapping(abbr, { stueckProAnsatz: e.target.value })}
                        />
                      </td>
                      <td className="py-1.5 px-2">
                        {!mapping[abbr]?.recipeId && (
                          <span title="Kein Rezept zugeordnet" style={{ color: COL.warn }}>
                            <AlertTriangle size={16} />
                          </span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {consolidated.length > 0 && (
              <div>
                <label className="flex items-center gap-2 text-sm mb-2" style={{ color: COL.ink }}>
                  <input type="checkbox" checked={schwundAktiv} onChange={(e) => setSchwundAktiv(e.target.checked)} />
                  Schwund abziehen (1,5 kg Roggenmehl 960 + 1,5 kg Dinkelmehl)
                </label>
                <p className="text-xs mb-2" style={{ color: COL.inkMuted }}>
                  Benötigte Rohstoffe für diesen Liefertag insgesamt{schwundAktiv ? " (inkl. 1,5 kg Schwund bei Roggenmehl 960 und Dinkelmehl)" : ""}:
                </p>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
                    <thead>
                      <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                        {["Rohstoff", "Benötigt", "Aktueller Bestand", "Nach Abzug"].map((h) => (
                          <th
                            key={h}
                            className="text-left py-1.5 px-2 font-medium"
                            style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                          >
                            {h}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {consolidated.map((c) => (
                        <tr key={c.materialId} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                          <td className="py-1.5 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                            {c.mat.name}
                            {c.isSchwund && (
                              <span
                                className="text-xs ml-2 px-1.5 py-0.5 rounded-full"
                                style={{ backgroundColor: COL.amberSoft, color: COL.amber }}
                              >
                                +1,5 kg Schwund
                              </span>
                            )}
                          </td>
                          <td className="py-1.5 px-2">
                            {fmtNum(c.needed)} {c.mat.unit}
                          </td>
                          <td className="py-1.5 px-2">
                            {fmtNum(c.mat.stock)} {c.mat.unit}
                          </td>
                          <td
                            className="py-1.5 px-2"
                            style={{ color: c.resultingStock < 0 ? COL.warn : COL.ink, fontWeight: c.resultingStock < 0 ? 600 : 400 }}
                          >
                            {fmtNum(c.resultingStock)} {c.mat.unit}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                {anyNegative && (
                  <div
                    className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg mt-2"
                    style={{ backgroundColor: COL.warnSoft, color: COL.warn }}
                  >
                    <AlertTriangle size={16} /> Für manche Rohstoffe reicht der aktuelle Bestand nicht aus.
                  </div>
                )}
              </div>
            )}

            {(unmappedActive.length > 0 || missingPieces.length > 0) && (
              <div className="text-xs px-3 py-2 rounded-lg" style={{ backgroundColor: COL.amberSoft, color: COL.amber }}>
                {unmappedActive.length > 0 && <div>Noch ohne Rezept: {unmappedActive.join(", ")}</div>}
                {missingPieces.length > 0 && <div>Noch ohne Stück/Ansatz: {missingPieces.join(", ")}</div>}
              </div>
            )}

            <div className="flex gap-2">
              <button
                onClick={applyDeduction}
                disabled={consolidated.length === 0}
                className="text-sm font-medium px-3 py-2 rounded-lg"
                style={{ backgroundColor: COL.accent, color: "#fff", opacity: consolidated.length === 0 ? 0.5 : 1 }}
              >
                Bestand abziehen
              </button>
              <button onClick={resetAll} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}` }}>
                Abbrechen
              </button>
            </div>
          </div>
        )}

        {status === "done" && (
          <div className="flex items-center gap-2 text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
            <CheckCircle2 size={16} /> Lagerbestand für den {fmtBlockDate(selectedBlock?.date)} wurde aktualisiert.
          </div>
        )}
      </Card>
      )}

      {orderHistory.length > 0 && (
        <Card>
          <h3 className="text-sm font-semibold mb-3" style={{ fontFamily: "'Fraunces', serif" }}>
            Bestellverlauf
          </h3>
          <div className="flex flex-col gap-2">
            {orderHistory.map((entry) => (
              <div
                key={entry.id}
                className="flex items-center justify-between text-sm px-3 py-2 rounded-lg"
                style={{ border: `1px solid ${COL.line}` }}
              >
                <div>
                  <div style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>{entry.label}</div>
                  <div className="text-xs" style={{ color: COL.inkMuted }}>
                    {new Date(entry.appliedAt).toLocaleString("de-DE")} · {entry.items.length} Rohstoffe abgezogen
                  </div>
                </div>
                <button
                  onClick={() => undoHistoryEntry(entry)}
                  className="text-xs font-medium px-2.5 py-1.5 rounded-lg"
                  style={{ border: `1px solid ${COL.warn}`, color: COL.warn }}
                >
                  Rückgängig
                </button>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

// ---------- Preise & Allergene importieren ----------
function PreiseImportPanel({ materials, setMaterials, onClose }) {
  const [text, setText] = useState("");
  const [status, setStatus] = useState("idle"); // idle | review | error
  const [rows, setRows] = useState([]);
  const [unmatchedCount, setUnmatchedCount] = useState(0);
  const [errorMsg, setErrorMsg] = useState("");

  const handleParse = () => {
    const { rows: parsed, error } = parsePriceList(text);
    if (error) {
      setStatus("error");
      setErrorMsg(error);
      return;
    }
    const matchedRows = [];
    let unmatched = 0;
    parsed.forEach((r) => {
      const { match, score } = findBestMatch(r.rawName, materials, (m) => m.name);
      if (!match) {
        unmatched++;
        return;
      }
      const priceG = r.priceKg != null ? Math.round((r.priceKg / 1000) * 10000) / 10000 : null;
      matchedRows.push({
        id: uid(),
        rawName: r.rawName,
        materialId: match.id,
        matchScore: score,
        priceG,
        allergene: r.allergene,
        zusatzstoffe: r.zusatzstoffe,
        uebernehmenPreis: priceG != null && priceG > 0,
        uebernehmenAllergene: r.allergene.length > 0,
        uebernehmenZusatzstoffe: r.zusatzstoffe.length > 0,
      });
    });
    setRows(matchedRows);
    setUnmatchedCount(unmatched);
    setStatus(matchedRows.length > 0 ? "review" : "error");
    if (matchedRows.length === 0) setErrorMsg("Keine der Zeilen konnte einem deiner Rohstoffe zugeordnet werden.");
  };

  const updateRow = (id, patch) => setRows((prev) => prev.map((r) => (r.id === id ? { ...r, ...patch } : r)));

  const apply = () => {
    setMaterials((prev) =>
      prev.map((m) => {
        const r = rows.find((r) => r.materialId === m.id);
        if (!r) return m;
        const patch = {};
        if (r.uebernehmenPreis && r.priceG != null) patch.price = r.priceG;
        if (r.uebernehmenAllergene && r.allergene.length > 0) patch.allergene = r.allergene;
        if (r.uebernehmenZusatzstoffe && r.zusatzstoffe) patch.zusatzstoffe = r.zusatzstoffe;
        return Object.keys(patch).length > 0 ? { ...m, ...patch } : m;
      })
    );
    onClose();
  };

  return (
    <div className="mb-5 p-4 rounded-lg" style={{ backgroundColor: COL.bg, border: `1px solid ${COL.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>
          Preise & Allergene importieren
        </h3>
        <button onClick={onClose} style={{ color: COL.inkMuted }}>
          <X size={16} />
        </button>
      </div>

      {status === "idle" && (
        <div className="flex flex-col gap-3">
          <p className="text-sm" style={{ color: COL.inkMuted }}>
            Füg hier deine komplette Preisliste ein (mit Kopfzeile, so wie aus Excel kopiert – Spalten "Produktbezeichnung im
            Rezept", "Nettopreis / kg" und "Lebensmittelkennzeichnung" werden automatisch erkannt). Nur Zeilen, die zu einem
            deiner vorhandenen Rohstoffe passen, werden übernommen. Bei Allergenen/Zusatzstoffen wird nichts geraten – wird
            nichts erkannt, bleibt das Feld unverändert.
          </p>
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder="Hier die Tabelle einfügen (inkl. Kopfzeile) …"
            className="w-full text-xs p-3 rounded-lg"
            style={{ ...inputStyle, height: 160, fontFamily: "'IBM Plex Mono', monospace", resize: "vertical" }}
          />
          <button
            onClick={handleParse}
            disabled={!text.trim()}
            className="text-sm font-medium px-3 py-2 rounded-lg w-fit"
            style={{ backgroundColor: COL.accent, color: "#fff", opacity: text.trim() ? 1 : 0.5 }}
          >
            Liste einlesen
          </button>
        </div>
      )}

      {status === "error" && (
        <div className="flex flex-col gap-3">
          <div className="text-sm px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>
            {errorMsg}
          </div>
          <button onClick={() => setStatus("idle")} className="text-sm font-medium underline w-fit" style={{ color: COL.accent }}>
            Erneut versuchen
          </button>
        </div>
      )}

      {status === "review" && (
        <div className="flex flex-col gap-4">
          <p className="text-xs" style={{ color: COL.inkMuted }}>
            {rows.length} von {rows.length + unmatchedCount} Katalogeinträgen deinem Lager zugeordnet
            {unmatchedCount > 0 ? ` (${unmatchedCount} betreffen Rohstoffe, die du nicht im Lager hast – übersprungen)` : ""}.
            Häkchen steuern, was übernommen wird.
          </p>
          <div className="overflow-x-auto">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["Rohstoff", "Preis/g", "", "Allergene", "", "Zusatzstoffe", ""].map((h, i) => (
                    <th
                      key={i}
                      className="text-left py-1.5 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => {
                  const mat = materials.find((m) => m.id === r.materialId);
                  return (
                    <tr key={r.id} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                      <td className="py-1.5 px-2 text-xs" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                        {mat?.name}
                        {r.matchScore < 0.75 && (
                          <span title="Unsichere Zuordnung, bitte prüfen" style={{ color: COL.warn, marginLeft: 4 }}>
                            <AlertTriangle size={12} style={{ display: "inline" }} />
                          </span>
                        )}
                      </td>
                      <td className="py-1.5 px-2">
                        <input
                          style={{ ...inputStyle, width: 80, padding: "4px 8px" }}
                          type="number"
                          step="0.0001"
                          value={r.priceG ?? ""}
                          onChange={(e) => updateRow(r.id, { priceG: e.target.value === "" ? null : Number(e.target.value) })}
                        />
                      </td>
                      <td className="py-1.5 px-2">
                        <input
                          type="checkbox"
                          checked={r.uebernehmenPreis}
                          onChange={(e) => updateRow(r.id, { uebernehmenPreis: e.target.checked })}
                        />
                      </td>
                      <td className="py-1.5 px-2 text-xs" style={{ fontFamily: "'IBM Plex Sans', sans-serif", color: COL.amber }}>
                        {r.allergene.length > 0 ? r.allergene.map(allergenLabel).join(", ") : <span style={{ color: COL.inkMuted }}>–</span>}
                      </td>
                      <td className="py-1.5 px-2">
                        {r.allergene.length > 0 && (
                          <input
                            type="checkbox"
                            checked={r.uebernehmenAllergene}
                            onChange={(e) => updateRow(r.id, { uebernehmenAllergene: e.target.checked })}
                          />
                        )}
                      </td>
                      <td className="py-1.5 px-2 text-xs" style={{ fontFamily: "'IBM Plex Sans', sans-serif", color: COL.inkMuted }}>
                        {r.zusatzstoffe || "–"}
                      </td>
                      <td className="py-1.5 px-2">
                        {r.zusatzstoffe && (
                          <input
                            type="checkbox"
                            checked={r.uebernehmenZusatzstoffe}
                            onChange={(e) => updateRow(r.id, { uebernehmenZusatzstoffe: e.target.checked })}
                          />
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="flex gap-2">
            <button onClick={apply} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
              Ausgewählte Werte übernehmen
            </button>
            <button onClick={onClose} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}` }}>
              Abbrechen
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
