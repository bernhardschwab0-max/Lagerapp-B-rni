  const [showPriceImport, setShowPriceImport] = useState(false);
  const filteredMaterials = useMemo(
    () => materials.filter((m) => m.name.toLowerCase().includes(search.toLowerCase())),
    [materials, search]
  );

  const startAdd = () => setForm({ ...emptyForm });
  const startEdit = (m) =>
    setForm({
      ...m,
      price: String(m.price),
      priceKg: String(Math.round((m.price || 0) * 1000 * 10000) / 10000),
      stock: String(m.stock),
      mindestbestand: String(m.mindestbestand ?? 0),
    });
  const cancel = () => setForm(null);

  const setPriceG = (value) =>
    setForm({
      ...form,
      price: value,
      priceKg: value === "" ? "" : String(Math.round((Number(value) || 0) * 1000 * 10000) / 10000),
    });
  const setPriceKg = (value) =>
    setForm({
      ...form,
      priceKg: value,
      price: value === "" ? "" : String(Math.round(((Number(value) || 0) / 1000) * 10000) / 10000),
    });

  const save = () => {
    if (!form.name.trim()) return;
    const clean = {
      ...form,
      price: Number(form.price) || 0,
      stock: Number(form.stock) || 0,
      mindestbestand: Number(form.mindestbestand) || 0,
    };
    delete clean.priceKg;
    if (form.id) {
      setMaterials((prev) => prev.map((m) => (m.id === form.id ? clean : m)));
    } else {
      setMaterials((prev) => [...prev, { ...clean, id: uid() }]);
    }
    setForm(null);
  };

  // Löschen nur mit Rückfrage. Wird der Rohstoff noch in Rezepten oder Vorstufen (Sauerteig …) verwendet,
  // muss ein Ersatz gewählt werden – sonst würde er beim Abbuchen einfach fehlen.
  const [loeschen, setLoeschen] = useState(null); // { mat, verwendung, ersatzId, bestandDazu }
  const loeschRef = React.useRef(null);
  useEffect(() => {
    if (loeschen) loeschRef.current?.scrollIntoView({ behavior: "smooth", block: "center" });
  }, [loeschen?.mat?.id]);
  const verwendung = (id) => [
    ...recipes.filter((r) => r.items.some((i) => i.materialId === id)).map((r) => r.name),
    ...materials.filter((m) => m.vorteig?.teile?.some((t) => t.materialId === id)).map((m) => m.name),
  ];
  const remove = (id) => {
    const mat = materials.find((m) => m.id === id);
    if (!mat) return;
    const v = verwendung(id);
    if (v.length === 0) {
      if (window.confirm(`Rohstoff „${mat.name}“ wirklich löschen?`)) setMaterials((prev) => prev.filter((m) => m.id !== id));
      return;
    }
    const andere = materials.filter((m) => m.id !== id && !m.vorteig);
    const vorschlag = findBestMatch(mat.name, andere).match;
    setLoeschen({ mat, verwendung: v, ersatzId: vorschlag?.id || "", bestandDazu: true });
  };
  const ersetzenUndLoeschen = () => {
    const { mat, ersatzId, bestandDazu } = loeschen;
    if (!ersatzId) return;
    setRecipes((prev) => prev.map((r) => (r.items.some((i) => i.materialId === mat.id) ? { ...r, items: r.items.map((i) => (i.materialId === mat.id ? { ...i, materialId: ersatzId } : i)) } : r)));
    setMaterials((prev) =>
      prev
        .filter((m) => m.id !== mat.id)
        .map((m) => {
          let n = m;
          if (m.vorteig?.teile?.some((t) => t.materialId === mat.id)) {
            n = { ...m, vorteig: { teile: m.vorteig.teile.map((t) => (t.materialId === mat.id ? { ...t, materialId: ersatzId } : t)) } };
          }
          if (bestandDazu && n.id === ersatzId) n = { ...n, stock: Math.round(((n.stock || 0) + (mat.stock || 0)) * 1000) / 1000 };
          return n;
        })
    );
    setLoeschen(null);
  };

  const loeschPanel = loeschen && (
    <div ref={loeschRef} className="mb-4 p-4 rounded-2xl" style={{ backgroundColor: COL.warnSoft, border: `1px solid ${COL.warn}`, animation: "fadeIn .2s ease" }}>
      <div className="font-semibold mb-1" style={{ color: COL.warn }}>„{loeschen.mat.name}“ wird noch verwendet</div>
      <p className="text-sm mb-3">
        In: <b>{loeschen.verwendung.join(", ")}</b>. Wähle, durch welchen Rohstoff er dort ersetzt werden soll – dann wird er gelöscht.
      </p>
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <span className="text-sm">Ersetzen durch</span>
        <select style={{ ...inputStyle, minWidth: 200 }} value={loeschen.ersatzId} onChange={(e) => setLoeschen({ ...loeschen, ersatzId: e.target.value })}>
          <option value="">– bitte wählen –</option>
          {materials
            .filter((m) => m.id !== loeschen.mat.id && !m.vorteig)
            .sort((a, b) => a.name.localeCompare(b.name, "de"))
            .map((m) => (
              <option key={m.id} value={m.id}>{m.name}</option>
            ))}
        </select>
      </div>
      {loeschen.mat.stock > 0 && (
        <label className="flex items-center gap-2 text-sm mb-3">
          <input type="checkbox" checked={loeschen.bestandDazu} onChange={(e) => setLoeschen({ ...loeschen, bestandDazu: e.target.checked })} />
          Bestand ({fmtNum(loeschen.mat.stock)} {loeschen.mat.unit}) zum Ersatz dazuzählen
        </label>
      )}
      <div className="flex gap-2">
        <button onClick={ersetzenUndLoeschen} disabled={!loeschen.ersatzId} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.warn, color: "#fff", opacity: loeschen.ersatzId ? 1 : 0.5 }}>
          Ersetzen & löschen
        </button>
        <button onClick={() => setLoeschen(null)} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}`, backgroundColor: "#fff" }}>
          Abbrechen
        </button>
      </div>
    </div>
  );

  const formPanel = !form ? null : (
    <div className="mb-1 p-4 rounded-lg" style={{ backgroundColor: COL.bg, border: `1px solid ${COL.line}` }}>
      <div className="grid grid-cols-2 sm:grid-cols-6 gap-3 mb-3">
        <Field label="Name">
          <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
        </Field>
        <Field label="Preis pro g (€)">
          <input style={inputStyle} type="number" step="0.0001" value={form.price} onChange={(e) => setPriceG(e.target.value)} />
        </Field>
        <Field label="Preis pro kg (€)">
          <input style={inputStyle} type="number" step="0.01" value={form.priceKg} onChange={(e) => setPriceKg(e.target.value)} />
        </Field>
        <Field label="Einheit">
          <select style={inputStyle} value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })}>
            {UNITS.map((u) => (
              <option key={u} value={u}>
                {u}
              </option>
            ))}
          </select>
        </Field>
        <Field label="Lagerbestand">
          <input
            style={inputStyle}
            type="number"
            step="0.01"
            value={form.stock}
            onChange={(e) => setForm({ ...form, stock: e.target.value })}
          />
        </Field>
        <Field label="Mindestbestand (Warnschwelle)">
          <input
            style={inputStyle}
            type="number"
            step="0.01"
            value={form.mindestbestand}
            onChange={(e) => setForm({ ...form, mindestbestand: e.target.value })}
            placeholder="0 = keine Warnung"
          />
        </Field>
      </div>
      <div className="mb-3">
        <Field label="Zusatzstoffe (z.B. Konservierungsstoff E202)">
          <input style={inputStyle} value={form.zusatzstoffe} onChange={(e) => setForm({ ...form, zusatzstoffe: e.target.value })} />
        </Field>
      </div>
      <div className="mb-4">
        <span className="text-sm block mb-1.5" style={{ color: COL.inkMuted }}>
          Allergene
        </span>
        <AllergenPicker selected={form.allergene} onChange={(a) => setForm({ ...form, allergene: a })} />
      </div>
      <div className="flex gap-2">
        <button onClick={save} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ backgroundColor: COL.accent, color: "#fff" }}>
          Speichern
        </button>
        <button onClick={cancel} className="text-sm font-medium px-3 py-2 rounded-lg" style={{ border: `1px solid ${COL.line}` }}>
          Abbrechen
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-4">
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h2 className="text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>
            Lagerliste
          </h2>
          {!form && (
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setShowScan(true)}
                className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg"
                style={{ border: `1px solid ${COL.accent}`, color: COL.accent }}
              >
                <Tag size={15} /> Rechnung scannen
              </button>
              <button
                onClick={() => setShowPriceImport(true)}
                className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg"
                style={{ border: `1px solid ${COL.accent}`, color: COL.accent }}
              >
                <Pencil size={15} /> Preise & Allergene
              </button>
              <button
                onClick={startAdd}
                className="flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-lg"
                style={{ backgroundColor: COL.accent, color: "#fff" }}
              >
                <Plus size={15} /> Neuer Rohstoff
              </button>
            </div>
          )}
        </div>

        {showScan && <InvoiceScanPanel materials={materials} setMaterials={setMaterials} onClose={() => setShowScan(false)} />}
        {showPriceImport && (
          <PreiseImportPanel materials={materials} setMaterials={setMaterials} onClose={() => setShowPriceImport(false)} />
        )}

        {loeschPanel}

        {!form && materials.length > 5 && (
          <input
            style={{ ...inputStyle, marginBottom: 14, width: "100%", maxWidth: 320 }}
            placeholder="Rohstoff suchen…"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
        )}

        {form && !form.id && <div className="mb-5">{formPanel}</div>}

        {materials.length === 0 ? (
          <p className="text-sm py-8 text-center" style={{ color: COL.inkMuted }}>
            Noch keine Rohstoffe erfasst.
          </p>
        ) : filteredMaterials.length === 0 ? (
          <p className="text-sm py-8 text-center" style={{ color: COL.inkMuted }}>
            Kein Rohstoff gefunden für "{search}".
          </p>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${COL.line}`, backgroundColor: COL.bg }}>
                  {["Name", "Preis", "Einheit", "Bestand", "Mind.", "Zusatzstoffe", "Allergene", ""].map((h) => (
                    <th
                      key={h}
                      className="text-left py-2 px-2 font-medium"
                      style={{ color: COL.inkMuted, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "11px", fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredMaterials.map((m) =>
                  form && form.id === m.id ? (
                    <tr key={m.id}>
                      <td colSpan={8} className="py-2">
                        {formPanel}
                      </td>
                    </tr>
                  ) : (
                    <tr key={m.id} className="hover:bg-black/[0.02] transition-colors" style={{ borderBottom: `1px solid ${COL.line}` }}>
                      <td className="py-2 px-2" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
                        {m.name}
                        {m.vorteig && (
                          <span
                            className="text-xs ml-2 px-1.5 py-0.5 rounded-full"
                            style={{ backgroundColor: COL.accentSoft, color: COL.accent }}
                            title="Wird bei der Kalkulation automatisch in Mehl + Wasser aufgelöst"
                          >
                            Vorteig (auto)
                          </span>
                        )}
                      </td>
                      <td className="py-2 px-2" style={{ whiteSpace: "nowrap" }}>{["g", "ml"].includes(m.unit) ? `${fmtEUR((m.price || 0) * 1000)}/${m.unit === "g" ? "kg" : "l"}` : `${fmtEUR(m.price)}/${m.unit}`}</td>
                      <td className="py-2 px-2">{m.unit}</td>
                      <td
                        className="py-2 px-2"
                        style={{
                          color: m.mindestbestand > 0 && m.stock <= m.mindestbestand ? COL.warn : COL.ink,
                          fontWeight: m.mindestbestand > 0 && m.stock <= m.mindestbestand ? 600 : 400,
                        }}
                      >
                        {fmtNum(m.stock)}
                      </td>
                      <td className="py-2 px-2 text-xs" style={{ color: COL.inkMuted }}>
                        {m.mindestbestand > 0 ? fmtNum(m.mindestbestand) : "–"}
                      </td>
                      <td className="py-2 px-2 text-xs" style={{ fontFamily: "'IBM Plex Sans', sans-serif", color: COL.inkMuted }}>
                        {m.zusatzstoffe || "–"}
                      </td>
                      <td className="py-2 px-2">
                        <div className="flex flex-wrap gap-1">
                          {m.allergene.length === 0 ? (
                            <span className="text-xs" style={{ color: COL.inkMuted }}>
                              –
                            </span>
                          ) : (
                            m.allergene.map((a) => (
                              <span
                                key={a}
                                className="text-xs px-1.5 py-0.5 rounded-full"
                                style={{ backgroundColor: COL.amberSoft, color: COL.amber, fontFamily: "'IBM Plex Sans', sans-serif" }}
                              >
                                {allergenLabel(a)}
                              </span>
                            ))
                          )}
                        </div>
                      </td>
                      <td className="py-2 px-2">
                        <div className="flex gap-2">
                          <button onClick={() => startEdit(m)} style={{ color: COL.inkMuted }}>
                            <Pencil size={14} />
                          </button>
                          <button onClick={() => remove(m.id)} style={{ color: COL.warn }}>
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  )
                )}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

// ---------- Rezepte Tab ----------
const fmtG = (n) => (isFinite(n) ? n.toLocaleString("de-DE", { maximumFractionDigits: n < 100 ? 1 : 0 }) : "–");
const MULTIPLIKATOREN = [1, 2, 3, 4, 5, 10, 15];

  return (
    <div
      className="rounded-2xl overflow-hidden transition-all"

        backgroundColor: COL.surface,
        border: `1px solid ${open ? COL.accent : COL.line}`,

        gridColumn: open ? "1 / -1" : undefined,
      }}
    >
      <button onClick={onToggle} className="w-full text-left p-4 flex items-start gap-3">
        <div
          className="w-11 h-11 rounded-xl flex items-center justify-center text-2xl flex-shrink-0"
          style={{ backgroundColor: COL.accentSoft }}
        >
          {katEmoji(r.kategorie)}
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-semibold text-base leading-tight" style={{ fontFamily: "'Fraunces', serif" }}>
            {r.name}
          </div>
          <div className="flex flex-wrap gap-1.5 mt-1.5">
            <Chip>{fmtG(gesamt)} g / Ansatz</Chip>
            {stueck > 1 && <Chip>{stueck} Stk.</Chip>}
            {r.teiggewicht && <Chip>⚖️ {r.teiggewicht}</Chip>}
            {r.backen && <Chip>🔥 {r.backen}</Chip>}

        </div>
        <span style={{ display: "inline-flex", transform: open ? "rotate(180deg)" : "none", transition: "transform .2s", color: COL.inkMuted, flexShrink: 0, marginTop: 4 }}><ChevronDown size={18} /></span>
      </button>

      {open && (
        <div className="px-4 pb-4" style={{ animation: "fadeIn .2s ease" }}>

                  color: faktor === f ? "#fff" : COL.ink,
                  border: `1px solid ${faktor === f ? COL.accent : COL.line}`,
                }}
              >
                ×{f}
              </button>
            ))}
            <input
              type="number"
              min="0"
              step="0.5"
              value={faktor}
              onChange={(e) => setFaktor(Math.max(0, Number(e.target.value) || 0))}
              style={{ ...inputStyle, width: 70, padding: "5px 8px" }}
              aria-label="Eigener Faktor"
            />
            <span className="text-sm ml-auto" style={{ color: COL.inkMuted }}>
              {stueck > 0 && <>= <b style={{ color: COL.ink }}>{fmtNum(stueck * faktor, 1)} Stück</b> · </>}
              <b style={{ color: COL.ink }}>{fmtG(gesamt * faktor)} g</b> Teig
            </span>
          </div>

          <div className="flex flex-col gap-3">
            {groups.map((g, gi) => (
              <div key={gi}>
                {g.titel && (
                  <div className="text-xs font-semibold uppercase mb-1.5" style={{ color: COL.accent, letterSpacing: "0.06em" }}>
                    {g.titel}
                  </div>
                )}
                <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${COL.line}` }}>
                  {g.items.map((it, i) => {
                    const m = mat(it.materialId);
                    return (
                      <div

                        className="flex items-center justify-between px-3 py-2 text-sm"
                        style={{ backgroundColor: i % 2 ? COL.bg : COL.surface }}
                      >
                        <span>{m ? m.name : "(gelöschter Rohstoff)"}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>
                          {fmtG(it.menge * faktor)} {m?.unit || ""}

                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {r.anleitung && (
            <div className="mt-4 rounded-xl p-3 text-sm leading-relaxed" style={{ backgroundColor: COL.amberSoft, whiteSpace: "pre-line" }}>

              <Trash2 size={14} /> Löschen
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Chip({ children }) {
  return (
    <span className="text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: COL.bg, color: COL.inkMuted, border: `1px solid ${COL.line}` }}>
      {children}
    </span>
